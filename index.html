<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova</title>
<style>
:root{--bg:#F3F5F9;--surface:#fff;--surface2:#EEF1F6;--line:#DDE2EC;--ink:#121A2D;--muted:#566077;--accent:#0F766E;--on-accent:#fff;--accent-soft:#DDF3EF;--accent-ink:#0B5F58;--danger:#B42318;--gold:#B7791F;--glass:rgba(255,255,255,.6);--glass-line:rgba(255,255,255,.75);--shadow:0 8px 24px rgba(18,26,45,.14);--neon:#0B5F58;--neon-glow:rgba(15,118,110,.45)}
@media (prefers-color-scheme:dark){:root{--bg:#0D121F;--surface:#161C2E;--surface2:#1E2640;--line:#2B3552;--ink:#E9EDF6;--muted:#A0AABF;--accent:#2DD4BF;--on-accent:#052E2A;--accent-soft:#153B3A;--accent-ink:#5EEAD4;--danger:#FDA29B;--gold:#F5C451;--glass:rgba(30,38,64,.6);--glass-line:rgba(255,255,255,.12);--shadow:0 8px 24px rgba(0,0,0,.45);--neon:#5EEAD4;--neon-glow:rgba(45,212,191,.55)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
h2{margin:0;font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 110px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.in{width:100%;min-height:44px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
textarea.in{resize:vertical;min-height:80px}
.btn{min-height:44px;padding:0 20px;border:none;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.bad{background:var(--danger);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--danger);font-weight:600;font-size:14px}
.row{display:flex;align-items:center;gap:12px}
.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:12px}
.ava{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;overflow:hidden;position:relative}
.ava img{width:100%;height:100%;object-fit:cover}
.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;max-width:100%}
.name>span:first-child{overflow:hidden;text-overflow:ellipsis}
.post-body{white-space:pre-wrap;word-break:break-word;margin:8px 0}
.pimg{display:block;max-width:100%;max-height:480px;border-radius:12px;margin:8px 0;object-fit:contain;background:var(--surface2)}
.link{background:none;border:none;color:var(--accent-ink);font-weight:700;padding:6px 0}
.tag{padding:2px 10px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);font-size:12px;font-weight:700}
.auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.auth .card{width:100%;max-width:400px;padding:32px;display:flex;flex-direction:column;gap:16px;border-radius:20px}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
.logo i{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-style:normal}
nav{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom));pointer-events:none;z-index:20}
nav div{pointer-events:auto;display:flex;gap:2px;max-width:420px;margin:0 auto;padding:5px;border-radius:28px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6)}
nav button{flex:1;min-height:48px;border:none;border-radius:22px;background:transparent;color:var(--muted);font-size:13px;font-weight:600}
nav button.on{background:var(--accent-soft);color:var(--accent-ink)}
.chat{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:0 auto}
.chat-head{padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:var(--surface)}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.b{max-width:78%;padding:8px 12px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.b.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.b.it{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.b small{display:block;opacity:.7;font-size:11px;margin-top:2px}
.composer{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;border:none;border-bottom:1px solid var(--line);background:transparent}
.list{padding:0;overflow:hidden}
.list .item:last-child{border-bottom:none}
.banner{height:110px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.banner img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.pad{padding:0 20px 20px}
.lift{margin-top:-40px;position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lift .ava{border:4px solid var(--surface);width:84px;height:84px;font-size:32px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;gap:8px;width:92px;padding:10px 6px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:12px;color:var(--muted);text-align:center}
.opt.sel{border-color:var(--accent)}
.opt:disabled{opacity:.45}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.sw button{width:46px;height:26px;border-radius:13px;border:none;background:var(--muted);position:relative;flex:none}
.sw button::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw button.on{background:var(--accent)}
.sw button.on::after{left:23px}
.pop{max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.nm-rose{color:#C2255C}.nm-blue{color:#1C5FD4}.nm-violet{color:#6741D9}.nm-gold{color:#8A5A00}
@media (prefers-color-scheme:dark){.nm-rose{color:#FF8FB1}.nm-blue{color:#7FB2FF}.nm-violet{color:#B9A5FF}.nm-gold{color:#F5C451}}
.nm-grad{background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:nmshift 4s linear infinite}
.nm-aurora{background-image:linear-gradient(90deg,#34D399,#3B82F6,#8B5CF6,#34D399)}
.nm-sunset{background-image:linear-gradient(90deg,#F97316,#EC4899,#F59E0B,#F97316)}
.nm-neon{color:var(--neon);text-shadow:0 0 6px var(--neon-glow),0 0 14px var(--neon-glow)}
@keyframes nmshift{from{background-position:0 0}to{background-position:200% 0}}
.fr-gold{box-shadow:0 0 0 2px var(--surface),0 0 0 4px #D69E2E}
.fr-rose{box-shadow:0 0 0 2px var(--surface),0 0 0 4px #E0457B}
.fr-blue{box-shadow:0 0 0 2px var(--surface),0 0 0 4px #3B82F6}
.fr-violet{box-shadow:0 0 0 2px var(--surface),0 0 0 4px #8B5CF6}
.fr-double{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--accent),0 0 0 5.5px var(--surface),0 0 0 7px var(--accent)}
.fr-neon{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--neon),0 0 14px 4px var(--neon-glow)}
.fr-rainbow{animation:frhue 4s linear infinite;box-shadow:0 0 0 2px var(--surface),0 0 0 4px #F43F5E}
@keyframes frhue{0%,100%{box-shadow:0 0 0 2px var(--surface),0 0 0 4px #F43F5E}25%{box-shadow:0 0 0 2px var(--surface),0 0 0 4px #F59E0B}50%{box-shadow:0 0 0 2px var(--surface),0 0 0 4px #10B981}75%{box-shadow:0 0 0 2px var(--surface),0 0 0 4px #3B82F6}}
@media (prefers-reduced-motion:reduce){.nm-grad,.fr-rainbow{animation:none}}
#toast{position:fixed;left:0;right:0;bottom:84px;display:flex;justify-content:center;pointer-events:none;z-index:30;padding:0 16px}
#toast span{background:rgba(15,23,42,.88);color:#fff;padding:10px 16px;border-radius:14px;font-weight:600;max-width:420px}
#toast span.bad{background:rgba(180,35,24,.92)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const $app = document.getElementById('app');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const COLORS = ['#0F766E', '#1C5FD4', '#6741D9', '#C2255C', '#C2410C', '#8A5A00', '#2F855A'];
const colorOf = (n) => COLORS[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const EMAIL = (u) => u.toLowerCase() + '@nova.example.com';
const PCOLS = 'id,username,display_name,bio,status,avatar_url,banner_url,banner_color,name_color,frame,hide_online,gr_public,last_seen,is_admin,is_premium,is_verified,title,is_banned,gr';
const NAMEFX = { default: ['Обычный', ''], rose: ['Розовый', 'nm-rose'], blue: ['Синий', 'nm-blue'], violet: ['Фиолетовый', 'nm-violet'], gold: ['Золотой', 'nm-gold'], aurora: ['Аврора · переливается', 'nm-grad nm-aurora'], sunset: ['Закат · переливается', 'nm-grad nm-sunset'], neon: ['Неон · свечение', 'nm-neon'] };
const FRAMES = { none: ['Без рамки', 0], gold: ['Золотая', 0], rose: ['Розовая', 0], blue: ['Синяя', 0], violet: ['Фиолетовая', 0], double: ['Двойная', 1], neon: ['Неон', 1], rainbow: ['Радужная', 1] };
const BANNERS = { sky: ['linear-gradient(135deg,#7DB4F5,#4B7BEC)', 0], mint: ['linear-gradient(135deg,#6EE7B7,#0F9488)', 0], lilac: ['linear-gradient(135deg,#C4B5FD,#7C5CE0)', 0], sunset: ['linear-gradient(135deg,#FDBA74,#EC4899)', 0], sand: ['linear-gradient(135deg,#E9D8A6,#C9A227)', 0], aurora: ['linear-gradient(135deg,#34D399,#7C5CE0)', 1] };
const prem = (p) => !!p.is_premium;
const nameOf = (p) => p.display_name || p.username;
const nameCls = (p) => (prem(p) && NAMEFX[p.name_color] ? NAMEFX[p.name_color][1] : '');
const frameCls = (p) => (p.frame && p.frame !== 'none' && FRAMES[p.frame] && (!FRAMES[p.frame][1] || prem(p)) ? 'fr-' + p.frame : '');
const bannerCss = (p) => { const b = BANNERS[p.banner_color]; return (b && (!b[1] || prem(p)) ? b : BANNERS.sky)[0]; };
const av = (p, s = 44) => `<span class="ava ${frameCls(p)}" style="width:${s}px;height:${s}px;font-size:${Math.round(s * .4)}px;background:${colorOf(p.username)}">${p.avatar_url ? `<img src="${esc(p.avatar_url)}" alt="">` : esc(p.username[0].toUpperCase())}</span>`;
const SVG_OK = '<svg width="16" height="16" viewBox="0 0 24 24" role="img" aria-label="Подтверждённый профиль" style="flex:none;color:var(--accent)"><circle cx="12" cy="12" r="11" fill="currentColor"/><polyline points="7 12.5 10.5 16 17 9" style="fill:none;stroke:var(--on-accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"/></svg>';
const SVG_STAR = '<svg width="16" height="16" viewBox="0 0 24 24" role="img" aria-label="Premium" style="flex:none;color:var(--gold)"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="currentColor"/></svg>';
const nm = (p) => `<span class="name"><span class="${nameCls(p)}">${esc(nameOf(p))}</span>${p.is_verified ? SVG_OK : ''}${prem(p) ? SVG_STAR : ''}</span>`;
const hm = (d) => d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
const timeStr = (iso) => {
  const d = new Date(iso), now = new Date();
  if (d.toDateString() === now.toDateString()) return hm(d);
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + ', ' + hm(d);
};
function seenText(p) {
  if (me && p.id === me.id) return p.hide_online ? 'в сети · скрыто от других' : 'в сети';
  if (p.hide_online) return 'был(а) недавно';
  if (!p.last_seen) return 'был(а) давно';
  const d = new Date(p.last_seen), now = new Date();
  if (now - d < 180000) return 'в сети';
  if (d.toDateString() === now.toDateString()) return 'был(а) сегодня в ' + hm(d);
  if (new Date(now - 86400000).toDateString() === d.toDateString()) return 'был(а) вчера в ' + hm(d);
  return 'был(а) ' + d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
}
let toastT;
function toast(text, bad) {
  const t = document.getElementById('toast');
  t.innerHTML = `<span class="${bad ? 'bad' : ''}">${esc(text)}</span>`;
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.innerHTML = ''; }, 3000);
}

const CFG = window.NOVA || {};
const configured = CFG.url && CFG.key && !String(CFG.url).startsWith('ВСТАВЬТЕ') && !String(CFG.key).startsWith('ВСТАВЬТЕ');
const sb = configured ? supabase.createClient(CFG.url, CFG.key) : null;
let me = null, tab = 'feed', chatWith = null, channel = null, back = 'feed', seenTimer = null;
const pcache = {};
const remember = (p) => { if (p && p.id) pcache[p.id] = Object.assign(pcache[p.id] || {}, p); return p; };

async function getProfile(id, fresh) {
  if (pcache[id] && !fresh) return pcache[id];
  const { data } = await sb.from('profiles').select(PCOLS).eq('id', id).single();
  return remember(data);
}

/* ---------- картинки: сжатие и загрузка ---------- */
function prepImage(file, o) {
  return new Promise((resolve, reject) => {
    if (!/^image\//.test(file.type)) return reject(new Error('Выберите изображение или GIF'));
    if (file.type === 'image/gif') return file.size <= 2 * 1024 * 1024 ? resolve(file) : reject(new Error('GIF больше 2 МБ: выберите файл поменьше'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Не удалось прочитать файл')); };
    img.onload = () => {
      let w = img.width, h = img.height, sx = 0, sy = 0, sw = w, sh = h;
      if (o.square) { const m = Math.min(w, h); sx = (w - m) / 2; sy = (h - m) / 2; sw = sh = m; w = h = m; }
      const k = Math.min(1, o.max / Math.max(w, h));
      const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob((b) => b ? resolve(b) : reject(new Error('Не удалось сжать фото')), 'image/jpeg', o.q || 0.85);
    };
    img.src = url;
  });
}
async function uploadImage(file, o) {
  const blob = await prepImage(file, o);
  const ext = blob.type === 'image/gif' ? 'gif' : 'jpg';
  const path = me.id + '/' + Date.now() + '.' + ext;
  const { error } = await sb.storage.from('media').upload(path, blob, { contentType: blob.type });
  if (error) throw new Error('Не удалось загрузить файл');
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}

/* ---------- вход и регистрация ---------- */
function showSetup() {
  $app.innerHTML = `<div class="auth"><div class="card"><div class="logo"><i>N</i>Nova</div>
  <h1>Нужна настройка</h1><div class="muted">Создайте рядом с index.html файл config.js и вставьте в него адрес и ключ проекта Supabase (см. инструкцию).</div></div></div>`;
}
function showAuth(mode = 'login', err = '') {
  const reg = mode === 'register';
  $app.innerHTML = `<div class="auth"><div class="card">
    <div class="logo"><i>N</i>Nova</div>
    <div><h1>${reg ? 'Создать аккаунт' : 'Вход'}</h1><div class="muted">${reg ? 'Придумайте юзернейм и пароль. Почта не нужна.' : 'Войдите по юзернейму и паролю.'}</div></div>
    <label><div class="muted"><b>Юзернейм</b></div><input id="u" class="in" autocomplete="username" autocapitalize="none" placeholder="username"></label>
    <label><div class="muted"><b>Пароль</b></div><input id="p" class="in" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}" placeholder="Ваш пароль"></label>
    ${reg ? `<label><div class="muted"><b>Повторите пароль</b></div><input id="p2" class="in" type="password" autocomplete="new-password"></label>
    <div class="muted">Юзернейм от 3 символов: латиница, цифры и _. Пароль от 8 символов. Без почты пароль восстановить нельзя, запомните его.</div>` : ''}
    <div class="err" id="err" role="alert">${esc(err)}</div>
    <button class="btn" id="go">${reg ? 'Создать аккаунт' : 'Войти'}</button>
    <button class="btn ghost" id="sw">${reg ? 'У меня уже есть аккаунт' : 'Создать аккаунт'}</button></div></div>`;
  const go = document.getElementById('go');
  const fail = (m) => { document.getElementById('err').textContent = m; go.disabled = false; go.textContent = reg ? 'Создать аккаунт' : 'Войти'; };
  const submit = async () => {
    const u = document.getElementById('u').value.trim().replace(/^@/, '');
    const p = document.getElementById('p').value;
    if (!/^[A-Za-z][A-Za-z0-9_]{2,31}$/.test(u)) return fail('Юзернейм: от 3 символов, латиница, цифры и _, начинается с буквы');
    if (reg) {
      if (p.length < 8) return fail('Пароль: минимум 8 символов');
      if (p !== document.getElementById('p2').value) return fail('Пароли не совпадают');
    }
    go.disabled = true; go.textContent = 'Подождите…';
    if (reg) {
      const { data, error } = await sb.auth.signUp({ email: EMAIL(u), password: p, options: { data: { username: u } } });
      if (error) return fail(/registered|already/i.test(error.message) ? 'Этот юзернейм уже занят' : /database/i.test(error.message) ? 'Юзернейм занят или недопустим' : 'Не удалось создать аккаунт: ' + error.message);
      if (!data.session) return fail('Вход не выполнен: в Supabase отключите «Confirm email» (см. инструкцию)');
    } else {
      const { error } = await sb.auth.signInWithPassword({ email: EMAIL(u), password: p });
      if (error) return fail('Неверный юзернейм или пароль');
    }
    start();
  };
  go.onclick = submit;
  $app.querySelectorAll('input').forEach((i) => i.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); }));
  document.getElementById('sw').onclick = () => showAuth(reg ? 'login' : 'register');
}

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showAuth();
  let prof = null;
  for (let i = 0; i < 4 && !prof; i++) {
    prof = (await sb.from('profiles').select(PCOLS).eq('id', session.user.id).maybeSingle()).data;
    if (!prof) await new Promise((r) => setTimeout(r, 400));
  }
  if (!prof) { await sb.auth.signOut(); return showAuth('login', 'Профиль не найден. Проверьте, что SQL-файлы выполнены'); }
  me = remember(prof);
  touchSeen(); clearInterval(seenTimer); seenTimer = setInterval(touchSeen, 60000);
  subscribe();
  go('feed');
}
function touchSeen() { if (me) sb.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', me.id).then(() => {}); }
function subscribe() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('nova')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'recipient=eq.' + me.id }, onIncoming)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, () => { if (tab === 'feed') loadFeed(); })
    .subscribe();
}
async function onIncoming(payload) {
  const m = payload.new;
  const p = await getProfile(m.sender);
  if (tab === 'chat' && chatWith && chatWith.id === m.sender) addBubble(m);
  else toast('Новое сообщение от @' + (p ? p.username : '...'));
  if (tab === 'chats') loadChats();
}

/* ---------- каркас и навигация ---------- */
const TABS = [['feed', 'Лента'], ['chats', 'Чаты'], ['profile', 'Профиль']];
function go(t, arg) {
  if (t === 'user' && arg && arg.id === me.id) t = 'profile';
  if (['feed', 'chats', 'profile'].indexOf(t) !== -1) back = t;
  tab = t;
  if (t === 'chat') { chatWith = arg; return renderChat(); }
  chatWith = null;
  const cur = t === 'user' || t === 'settings' ? (t === 'settings' ? 'profile' : back) : t;
  $app.innerHTML = `<main class="wrap" id="view"></main>
  <nav><div>${TABS.map((x) => `<button data-t="${x[0]}" class="${x[0] === cur ? 'on' : ''}">${x[1]}</button>`).join('')}</div></nav>`;
  $app.querySelectorAll('nav button').forEach((b) => { b.onclick = () => go(b.dataset.t); });
  window.scrollTo(0, 0);
  if (t === 'feed') loadFeed();
  else if (t === 'chats') loadChats();
  else if (t === 'profile') renderProfile(me, true);
  else if (t === 'user') renderProfile(arg, false);
  else if (t === 'settings') renderSettings();
}
const view = () => document.getElementById('view');
const openUser = async (id) => { const p = await getProfile(id, true); if (p) go('user', p); };

/* ---------- лента ---------- */
let postImg = null;
async function loadFeed() {
  const v = view(); if (!v) return;
  if (!v.dataset.ready) {
    v.dataset.ready = 1; postImg = null;
    v.innerHTML = `<h1>Лента</h1><div class="card col"><textarea id="nt" class="in" maxlength="2000" placeholder="Что нового?"></textarea>
    <div id="prev"></div>
    <div class="row wrapr"><label class="btn ghost sm file">Фото или GIF<input type="file" id="pf" accept="image/*"></label><button class="btn" id="pub">Опубликовать</button></div></div>
    <div id="posts" class="col" style="gap:16px"></div>`;
    document.getElementById('pf').onchange = async (e) => {
      const f = e.target.files[0]; e.target.value = ''; if (!f) return;
      try { postImg = await prepImage(f, { max: 1280, q: 0.82 }); } catch (er) { return toast(er.message, true); }
      const u = URL.createObjectURL(postImg);
      document.getElementById('prev').innerHTML = `<img class="pimg" src="${u}" alt=""><button class="btn ghost sm" id="rm">Убрать фото</button>`;
      document.getElementById('rm').onclick = () => { postImg = null; document.getElementById('prev').innerHTML = ''; };
    };
    document.getElementById('pub').onclick = async (e) => {
      const t = document.getElementById('nt'); const body = t.value.trim();
      if (!body && !postImg) return toast('Напишите текст или добавьте фото', true);
      const btn = e.target; btn.disabled = true;
      try {
        let image_url = null;
        if (postImg) image_url = await uploadImage(postImg instanceof File ? postImg : new File([postImg], 'p', { type: postImg.type }), { max: 1280 });
        const { error } = await sb.from('posts').insert({ body: body || ' ', image_url });
        if (error) throw new Error(me.is_banned ? 'Вы заблокированы' : 'Не удалось опубликовать');
        t.value = ''; postImg = null; document.getElementById('prev').innerHTML = ''; toast('Пост опубликован');
      } catch (er) { toast(er.message, true); }
      btn.disabled = false; loadFeed();
    };
  }
  const [{ data, error }, { data: mine }] = await Promise.all([
    sb.from('posts').select(`id,body,image_url,pinned,created_at,author,profiles(${PCOLS}),comments(count),post_likes(count)`).order('pinned', { ascending: false }).order('created_at', { ascending: false }).limit(50),
    sb.from('post_likes').select('post_id').eq('user_id', me.id)
  ]);
  const box = document.getElementById('posts'); if (!box) return;
  if (error) { box.innerHTML = '<div class="err">Не удалось загрузить ленту</div>'; return; }
  const liked = new Set((mine || []).map((x) => x.post_id));
  data.forEach((p) => remember(p.profiles));
  box.innerHTML = data.length ? data.map((p) => {
    const a = pcache[p.author] || p.profiles, mineP = p.author === me.id, n = (x) => (x && x[0] ? x[0].count : 0);
    return `<article class="card" data-id="${p.id}">
    <div class="row"><button class="link" style="padding:0" data-u="${p.author}">${av(a)}</button><div class="grow"><button class="link" style="padding:0;text-align:left;max-width:100%" data-u="${p.author}">${nm(a)}</button><div class="muted">@${esc(a.username)} · ${timeStr(p.created_at)}${p.pinned ? ' · 📌 закреплено' : ''}</div></div>
    ${mineP ? '' : `<button class="btn ghost sm" data-dm="${p.author}">Написать</button>`}</div>
    ${p.body.trim() ? `<div class="post-body">${esc(p.body)}</div>` : ''}${p.image_url ? `<img class="pimg" src="${esc(p.image_url)}" alt="" loading="lazy">` : ''}
    <div class="row wrapr"><button class="link" data-like="${p.id}">${liked.has(p.id) ? '♥' : '♡'} ${n(p.post_likes)}</button><button class="link" data-cm="${p.id}">Комментарии (${n(p.comments)})</button>
    ${me.is_admin ? `<button class="link" data-pin="${p.id}" data-v="${p.pinned ? 0 : 1}">${p.pinned ? 'Открепить' : 'Закрепить'}</button>` : ''}
    ${mineP || me.is_admin ? `<button class="link" style="color:var(--danger)" data-del="${p.id}">Удалить</button>` : ''}</div><div class="cms"></div></article>`;
  }).join('') : '<div class="muted">Пока постов нет. Напишите первый!</div>';
  box.onclick = async (e) => {
    const t = e.target.closest('button'); if (!t) return;
    const d = t.dataset;
    if (d.u) openUser(d.u);
    else if (d.dm) { const p = await getProfile(d.dm); if (p) go('chat', p); }
    else if (d.cm) toggleComments(t.closest('article'), d.cm);
    else if (d.like) { const had = t.textContent.trim().startsWith('♥'); const r = had ? await sb.from('post_likes').delete().eq('post_id', d.like).eq('user_id', me.id) : await sb.from('post_likes').insert({ post_id: d.like }); if (r.error) toast('Не удалось поставить лайк', true); loadFeed(); }
    else if (d.pin) { const r = await sb.rpc('admin_pin_post', { p_post: d.pin, p_pinned: d.v === '1' }); toast(r.error ? 'Не удалось' : (d.v === '1' ? 'Пост закреплён' : 'Пост откреплён'), !!r.error); loadFeed(); }
    else if (d.del) { if (!confirm('Удалить пост?')) return; const r = await sb.from('posts').delete().eq('id', d.del); toast(r.error ? 'Не удалось удалить' : 'Пост удалён', !!r.error); loadFeed(); }
  };
}
async function toggleComments(card, postId) {
  const box = card.querySelector('.cms');
  if (box.innerHTML) { box.innerHTML = ''; return; }
  const draw = async () => {
    const { data } = await sb.from('comments').select(`id,body,created_at,author,profiles(${PCOLS})`).eq('post_id', postId).order('created_at');
    (data || []).forEach((c) => remember(c.profiles));
    box.innerHTML = (data || []).map((c) => `<div class="row" style="align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)"><div class="grow"><button class="link" style="padding:0" data-cu="${c.author}">${nm(pcache[c.author])}</button> <span class="muted">@${esc(pcache[c.author].username)} · ${timeStr(c.created_at)}</span><div class="post-body" style="margin:2px 0 0">${esc(c.body)}</div></div>${c.author === me.id || me.is_admin ? `<button class="link" data-dc="${c.id}">Удалить</button>` : ''}</div>`).join('')
      + `<div class="row" style="margin-top:8px"><input class="in" id="ci" maxlength="1000" placeholder="Ваш комментарий"><button class="btn sm" id="cs">Отправить</button></div>`;
    box.querySelector('#cs').onclick = async () => {
      const body = box.querySelector('#ci').value.trim(); if (!body) return;
      const { error } = await sb.from('comments').insert({ post_id: postId, body });
      toast(error ? 'Не удалось отправить' : 'Комментарий добавлен', !!error); draw();
    };
    box.querySelectorAll('[data-dc]').forEach((b) => { b.onclick = async () => { await sb.from('comments').delete().eq('id', b.dataset.dc); draw(); }; });
    box.querySelectorAll('[data-cu]').forEach((b) => { b.onclick = () => openUser(b.dataset.cu); });
  };
  draw();
}

/* ---------- чаты ---------- */
async function loadChats() {
  const v = view(); if (!v) return;
  if (!v.dataset.ready) {
    v.dataset.ready = 1;
    v.innerHTML = `<h1>Чаты</h1><div class="card"><input id="q" class="in" placeholder="Найти по юзернейму" autocapitalize="none"><div id="found" style="margin-top:8px"></div></div>
    <div class="card list" id="convs"></div>`;
    document.getElementById('q').oninput = async (e) => {
      const q = e.target.value.trim().replace(/^@/, '').replace(/[%_\\]/g, (c) => '\\' + c);
      const f = document.getElementById('found');
      if (!q) { f.innerHTML = ''; return; }
      const { data } = await sb.from('profiles').select(PCOLS).ilike('username', q + '%').neq('id', me.id).limit(8);
      (data || []).forEach(remember);
      f.innerHTML = data && data.length ? data.map((p) => `<button class="item" data-u="${p.id}">${av(p)}<div class="grow">${nm(p)}<div class="muted">@${esc(p.username)}</div></div></button>`).join('') : '<div class="muted">Никого не найдено</div>';
      f.onclick = (ev) => { const b = ev.target.closest('[data-u]'); if (b) go('chat', pcache[b.dataset.u]); };
    };
  }
  const { data } = await sb.from('messages').select('sender,recipient,body,created_at').or(`sender.eq.${me.id},recipient.eq.${me.id}`).order('created_at', { ascending: false }).limit(300);
  const last = {};
  (data || []).forEach((m) => { const o = m.sender === me.id ? m.recipient : m.sender; if (!last[o]) last[o] = m; });
  const ids = Object.keys(last);
  await Promise.all(ids.map((id) => getProfile(id)));
  const box = document.getElementById('convs'); if (!box) return;
  box.innerHTML = ids.length ? ids.map((id) => { const p = pcache[id], m = last[id]; return p ? `<button class="item" data-u="${id}">${av(p)}<div class="grow">${nm(p)}<div class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.sender === me.id ? 'Вы: ' : ''}${esc(m.body)}</div></div><span class="muted">${timeStr(m.created_at)}</span></button>` : ''; }).join('') : '<div class="muted" style="padding:16px">Диалогов пока нет. Найдите друга по юзернейму выше.</div>';
  box.onclick = (ev) => { const b = ev.target.closest('[data-u]'); if (b) go('chat', pcache[b.dataset.u]); };
}
const bubble = (m) => `<div class="b ${m.sender === me.id ? 'me' : 'it'}">${esc(m.body)}<small>${timeStr(m.created_at)}</small></div>`;
function addBubble(m) {
  const box = document.getElementById('msgs'); if (!box) return;
  const empty = box.querySelector('.muted'); if (empty) empty.remove();
  box.insertAdjacentHTML('beforeend', bubble(m));
  box.scrollTop = box.scrollHeight;
}
async function renderChat() {
  const o = await getProfile(chatWith.id, true) || chatWith; chatWith = o;
  $app.innerHTML = `<div class="chat"><div class="chat-head"><button class="btn ghost sm" id="back" aria-label="Назад">←</button><button class="link" id="who" style="padding:0">${av(o)}</button><div class="grow">${nm(o)}<div class="muted">${esc(seenText(o))}</div></div></div>
  <div class="msgs" id="msgs"></div>
  <form class="composer" id="f"><input class="in" id="mt" maxlength="4000" placeholder="Сообщение" autocomplete="off"><button class="btn">Отправить</button></form></div>`;
  document.getElementById('back').onclick = () => go(back === 'profile' ? 'chats' : back);
  document.getElementById('who').onclick = () => go('user', o);
  const { data } = await sb.from('messages').select('id,sender,recipient,body,created_at')
    .or(`and(sender.eq.${me.id},recipient.eq.${o.id}),and(sender.eq.${o.id},recipient.eq.${me.id})`).order('created_at').limit(200);
  const box = document.getElementById('msgs'); if (!box) return;
  box.innerHTML = (data || []).map(bubble).join('') || '<div class="muted" style="text-align:center">Напишите первое сообщение</div>';
  box.scrollTop = box.scrollHeight;
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    const i = document.getElementById('mt'); const body = i.value.trim(); if (!body) return;
    i.value = '';
    const { data: m, error } = await sb.from('messages').insert({ recipient: o.id, body }).select().single();
    if (error) { i.value = body; return toast(me.is_banned ? 'Вы заблокированы' : 'Не удалось отправить', true); }
    addBubble(m);
  };
  document.getElementById('mt').focus();
}

async function loadUserPosts(u) {

}

  if (error) { toast('Не удалось сохранить', true); return false; }

}

      <button class="btn sm ${t.is_premium ? 'on' : 'ghost'}" data-perk="premium">Premium</button>
      <button class="btn sm ${t.is_verified ? 'on' : 'ghost'}" data-perk="verified">Галочка</button>
      <button class="btn sm ${t.title === 'Модератор' ? 'on' : 'ghost'}" data-perk="mod">Модератор</button>
      ${t.id !== me.id ? `<button class="btn sm ${t.is_banned ? 'bad' : 'ghost'}" data-perk="ban">${t.is_banned ? 'Разблокировать' : 'Заблокировать'}</button>` : ''}</div>
    <div class="row wrapr"><input id="gra" class="in grow" placeholder="Сколько GR выдать" inputmode="numeric" style="min-width:140px"><button class="btn" id="grb">Выдать GR</button></div></div>` : '<div class="muted">Пользователь не выбран.</div>'}`;
  const list = document.getElementById('alist');
  const draw = (rows) => {
    rows.forEach(remember);
    list.innerHTML = rows.length ? `<div class="pop">${rows.map((p) => `<button class="item" data-pick="${p.id}">${av(p, 36)}<div class="grow">${nm(p)}<div class="muted">@${esc(p.username)} · ${Number(p.gr).toLocaleString('ru-RU')} GR</div></div></button>`).join('')}</div>` : '<div class="muted">Никого не найдено</div>';
    list.onclick = (e) => { const b = e.target.closest('[data-pick]'); if (b) { adminSel = b.dataset.pick; adminAll = false; renderAdmin(); } };
  };
  document.getElementById('aq').oninput = async (e) => {
    const q = e.target.value.trim().replace(/^@/, '').replace(/[%_,()\\]/g, '');
    if (!q) { list.innerHTML = ''; return; }
    const { data } = await sb.from('profiles').select(PCOLS).or(`username.ilike.%${q}%,display_name.ilike.%${q}%`).limit(10);
    draw(data || []);
  };
  document.getElementById('aall').onclick = () => { adminAll = !adminAll; renderAdmin(); };
  if (adminAll) sb.from('profiles').select(PCOLS).order('created_at').limit(200).then(({ data }) => draw(data || []));
  if (t) {
    document.getElementById('aopen').onclick = () => go('user', t);
    box.querySelectorAll('[data-perk]').forEach((b) => { b.onclick = async () => {
      const k = b.dataset.perk, a = { premium: t.is_premium, verified: t.is_verified, title: t.title || '', banned: t.is_banned };
      if (k === 'premium') a.premium = !a.premium; else if (k === 'verified') a.verified = !a.verified;
      else if (k === 'mod') a.title = a.title === 'Модератор' ? '' : 'Модератор'; else a.banned = !a.banned;
      const { error } = await sb.rpc('admin_set_user', { target: t.id, p_premium: a.premium, p_verified: a.verified, p_title: a.title, p_banned: a.banned });
      if (error) return toast('Не удалось изменить', true);
      await getProfile(t.id, true); if (t.id === me.id) me = pcache[me.id]; toast('Сохранено'); renderAdmin();
    }; });
    document.getElementById('grb').onclick = async () => {
      const n = parseInt(document.getElementById('gra').value, 10);
      if (!(n >= 1 && n <= 1000000)) return toast('Количество: от 1 до 1 000 000', true);
      const { error } = await sb.rpc('admin_grant_gr', { target: t.id, amount: n });
      if (error) return toast('Не удалось выдать GR', true);
      await getProfile(t.id, true); if (t.id === me.id) me = pcache[me.id]; toast('Выдано ' + n.toLocaleString('ru-RU') + ' GR: @' + t.username); renderAdmin();
    };
  }
}

if (!configured) showSetup(); else start();
</script>
</body>
</html>
