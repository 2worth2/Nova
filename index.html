<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova</title>
<style>
:root{--bg:#F3F5F9;--surface:#fff;--surface2:#EEF1F6;--line:#DDE2EC;--ink:#121A2D;--muted:#566077;--accent:#0F766E;--on-accent:#fff;--accent-soft:#DDF3EF;--accent-ink:#0B5F58;--danger:#B42318;--glass:rgba(255,255,255,.6);--glass-line:rgba(255,255,255,.75);--shadow:0 8px 24px rgba(18,26,45,.14)}
@media (prefers-color-scheme:dark){:root{--bg:#0D121F;--surface:#161C2E;--surface2:#1E2640;--line:#2B3552;--ink:#E9EDF6;--muted:#A0AABF;--accent:#2DD4BF;--on-accent:#052E2A;--accent-soft:#153B3A;--accent-ink:#5EEAD4;--danger:#FDA29B;--glass:rgba(30,38,64,.6);--glass-line:rgba(255,255,255,.12);--shadow:0 8px 24px rgba(0,0,0,.45)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 110px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.in{width:100%;min-height:44px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
textarea.in{resize:vertical;min-height:80px}
.btn{min-height:44px;padding:0 20px;border:none;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--danger);font-weight:600;font-size:14px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ava{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post-body{white-space:pre-wrap;word-break:break-word;margin:8px 0}
.link{background:none;border:none;color:var(--accent-ink);font-weight:700;padding:6px 0}
.auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.auth .card{width:100%;max-width:400px;padding:32px;display:flex;flex-direction:column;gap:16px;border-radius:20px}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
.logo i{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-style:normal}
nav{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom));pointer-events:none;z-index:20}
nav div{pointer-events:auto;display:flex;gap:2px;max-width:360px;margin:0 auto;padding:5px;border-radius:28px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6)}
nav button{flex:1;min-height:48px;border:none;border-radius:22px;background:transparent;color:var(--muted);font-size:13px;font-weight:600}
nav button.on{background:var(--accent-soft);color:var(--accent-ink)}
.chat{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:0 auto}
.chat-head{padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:var(--surface)}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.b{max-width:78%;padding:8px 12px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.b.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.b.it{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.b small{display:block;opacity:.7;font-size:11px;margin-top:2px}
.composer{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;border:none;border-bottom:1px solid var(--line);background:transparent}
.list{padding:0;overflow:hidden}
.list .item:last-child{border-bottom:none}
#toast{position:fixed;left:0;right:0;bottom:84px;display:flex;justify-content:center;pointer-events:none;z-index:30;padding:0 16px}
#toast span{background:rgba(15,23,42,.88);color:#fff;padding:10px 16px;border-radius:14px;font-weight:600;max-width:420px}
#toast span.bad{background:rgba(180,35,24,.92)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== НАСТРОЙКА: вставьте данные из Supabase (Project Settings -> API) ===== */
const SUPABASE_URL = 'https://htnhaqbenpykcnqslkkn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0bmhhcWJlbnB5a2NucXNsa2tuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MDc0NTQsImV4cCI6MjEwOTE4MzQ1NH0.64uXtohqLgIoJ2dhiKTGuK2xbeSv2dI8bt1XzeXpkmk';
/* ============================================================================ */

const $app = document.getElementById('app');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const COLORS = ['#0F766E', '#1C5FD4', '#6741D9', '#C2255C', '#C2410C', '#8A5A00', '#2F855A'];
const colorOf = (n) => COLORS[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const ava = (p) => `<span class="ava" style="background:${colorOf(p.username)}">${esc(p.username[0].toUpperCase())}</span>`;
const nameOf = (p) => p.display_name || p.username;
const EMAIL = (u) => u.toLowerCase() + '@nova.example.com';
const timeStr = (iso) => {
  const d = new Date(iso), now = new Date();
  const hm = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === now.toDateString()) return hm;
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + ', ' + hm;
};
let toastT;
function toast(text, bad) {
  const t = document.getElementById('toast');
  t.innerHTML = `<span class="${bad ? 'bad' : ''}">${esc(text)}</span>`;
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.innerHTML = ''; }, 3000);
}

const configured = !SUPABASE_URL.startsWith('ВСТАВЬТЕ') && !SUPABASE_KEY.startsWith('ВСТАВЬТЕ');
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
let me = null, tab = 'feed', chatWith = null, channel = null, openPost = null;
const pcache = {};

async function getProfile(id) {
  if (pcache[id]) return pcache[id];
  const { data } = await sb.from('profiles').select('id,username,display_name').eq('id', id).single();
  if (data) pcache[id] = data;
  return data;
}

/* ---------- вход и регистрация ---------- */
function showSetup() {
  $app.innerHTML = `<div class="auth"><div class="card"><div class="logo"><i>N</i>Nova</div>
  <h1>Нужна настройка</h1><div class="muted">Откройте index.html и вставьте адрес и ключ проекта Supabase в блок «НАСТРОЙКА» в начале скрипта. Подробности в инструкции.</div></div></div>`;
}
function showAuth(mode = 'login', err = '') {
  const reg = mode === 'register';
  $app.innerHTML = `<div class="auth"><div class="card">
    <div class="logo"><i>N</i>Nova</div>
    <div><h1>${reg ? 'Создать аккаунт' : 'Вход'}</h1><div class="muted">${reg ? 'Придумайте юзернейм и пароль. Почта не нужна.' : 'Войдите по юзернейму и паролю.'}</div></div>
    <label><div class="muted"><b>Юзернейм</b></div><input id="u" class="in" autocomplete="username" autocapitalize="none" placeholder="username"></label>
    <label><div class="muted"><b>Пароль</b></div><input id="p" class="in" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}" placeholder="Ваш пароль"></label>
    ${reg ? `<label><div class="muted"><b>Повторите пароль</b></div><input id="p2" class="in" type="password" autocomplete="new-password"></label>
    <div class="muted">Юзернейм от 3 символов: латиница, цифры и _. Пароль от 8 символов. Без почты пароль восстановить нельзя, запомните его.</div>` : ''}
    <div class="err" id="err" role="alert">${esc(err)}</div>
    <button class="btn" id="go">${reg ? 'Создать аккаунт' : 'Войти'}</button>
    <button class="btn ghost" id="sw">${reg ? 'У меня уже есть аккаунт' : 'Создать аккаунт'}</button></div></div>`;
  const go = document.getElementById('go');
  const fail = (m) => { document.getElementById('err').textContent = m; go.disabled = false; go.textContent = reg ? 'Создать аккаунт' : 'Войти'; };
  const submit = async () => {
    const u = document.getElementById('u').value.trim().replace(/^@/, '');
    const p = document.getElementById('p').value;
    if (!/^[A-Za-z][A-Za-z0-9_]{2,31}$/.test(u)) return fail('Юзернейм: от 3 символов, латиница, цифры и _, начинается с буквы');
    if (reg) {
      if (p.length < 8) return fail('Пароль: минимум 8 символов');
      if (p !== document.getElementById('p2').value) return fail('Пароли не совпадают');
    }
    go.disabled = true; go.textContent = 'Подождите…';
    if (reg) {
      const { data, error } = await sb.auth.signUp({ email: EMAIL(u), password: p, options: { data: { username: u } } });
      if (error) return fail(/registered|already/i.test(error.message) ? 'Этот юзернейм уже занят' : /database/i.test(error.message) ? 'Юзернейм занят или недопустим' : 'Не удалось создать аккаунт: ' + error.message);
      if (!data.session) return fail('Вход не выполнен: в Supabase отключите «Confirm email» (см. инструкцию)');
    } else {
      const { error } = await sb.auth.signInWithPassword({ email: EMAIL(u), password: p });
      if (error) return fail('Неверный юзернейм или пароль');
    }
    start();
  };
  go.onclick = submit;
  $app.querySelectorAll('input').forEach((i) => i.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); }));
  document.getElementById('sw').onclick = () => showAuth(reg ? 'login' : 'register');
}

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showAuth();
  let prof = null;
  for (let i = 0; i < 4 && !prof; i++) {
    prof = (await sb.from('profiles').select('id,username,display_name').eq('id', session.user.id).maybeSingle()).data;
    if (!prof) await new Promise((r) => setTimeout(r, 400));
  }
  if (!prof) { await sb.auth.signOut(); return showAuth('login', 'Профиль не найден. Проверьте, что schema.sql выполнен'); }
  me = prof; pcache[me.id] = me;
  subscribe();
  go('feed');
}
function subscribe() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('nova')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'recipient=eq.' + me.id }, onIncoming)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, () => { if (tab === 'feed' && !openPost) loadFeed(); })
    .subscribe();
}
async function onIncoming(payload) {
  const m = payload.new;
  const p = await getProfile(m.sender);
  if (tab === 'chat' && chatWith && chatWith.id === m.sender) { addBubble(m); }
  else toast('Новое сообщение от @' + (p ? p.username : '...'));
  if (tab === 'chats') loadChats();
}

/* ---------- каркас ---------- */
function go(t, arg) {
  tab = t; openPost = null;
  if (t === 'chat') { chatWith = arg; return renderChat(); }
  chatWith = null;
  $app.innerHTML = `<main class="wrap" id="view"></main>
  <nav><div>${[['feed', 'Лента'], ['chats', 'Чаты'], ['profile', 'Профиль']].map((x) => `<button data-t="${x[0]}" class="${x[0] === t ? 'on' : ''}">${x[1]}</button>`).join('')}</div></nav>`;
  $app.querySelectorAll('nav button').forEach((b) => { b.onclick = () => go(b.dataset.t); });
  ({ feed: loadFeed, chats: loadChats, profile: renderProfile })[t]();
}
const view = () => document.getElementById('view');

/* ---------- лента ---------- */
async function loadFeed() {
  const v = view(); if (!v) return;
  if (!v.dataset.ready) {
    v.dataset.ready = 1;
    v.innerHTML = `<h1>Лента</h1><div class="card"><textarea id="nt" class="in" maxlength="2000" placeholder="Что нового?"></textarea>
    <div style="margin-top:8px"><button class="btn" id="pub">Опубликовать</button></div></div><div id="posts" style="display:flex;flex-direction:column;gap:16px"></div>`;
    document.getElementById('pub').onclick = async () => {
      const t = document.getElementById('nt'); const body = t.value.trim();
      if (!body) return toast('Напишите текст поста', true);
      const { error } = await sb.from('posts').insert({ body });
      if (error) return toast('Не удалось опубликовать', true);
      t.value = ''; toast('Пост опубликован'); loadFeed();
    };
  }
  const { data, error } = await sb.from('posts').select('id,body,created_at,author,profiles(username,display_name),comments(count)').order('created_at', { ascending: false }).limit(50);
  const box = document.getElementById('posts'); if (!box) return;
  if (error) { box.innerHTML = '<div class="err">Не удалось загрузить ленту</div>'; return; }
  box.innerHTML = data.length ? data.map((p) => `<article class="card" data-id="${p.id}">
    <div class="row">${ava(p.profiles)}<div class="grow"><div class="name">${esc(nameOf(p.profiles))}</div><div class="muted">@${esc(p.profiles.username)} · ${timeStr(p.created_at)}</div></div>
    ${p.profiles.username === me.username ? `<button class="btn ghost sm" data-del="${p.id}">Удалить</button>` : `<button class="btn ghost sm" data-dm="${p.author}">Написать</button>`}</div>
    <div class="post-body">${esc(p.body)}</div>
    <button class="link" data-cm="${p.id}">Комментарии (${p.comments[0] ? p.comments[0].count : 0})</button><div class="cms"></div></article>`).join('') : '<div class="muted">Пока постов нет. Напишите первый!</div>';
  box.onclick = async (e) => {
    const t = e.target;
    if (t.dataset.del) { if (!confirm('Удалить пост?')) return; const { error: er } = await sb.from('posts').delete().eq('id', t.dataset.del); toast(er ? 'Не удалось удалить' : 'Пост удалён', !!er); loadFeed(); }
    else if (t.dataset.dm) { const p = await getProfile(t.dataset.dm); if (p) go('chat', p); }
    else if (t.dataset.cm) toggleComments(t.closest('article'), t.dataset.cm);
  };
}
async function toggleComments(card, postId) {
  const box = card.querySelector('.cms');
  if (box.innerHTML) { box.innerHTML = ''; openPost = null; return; }
  openPost = postId;
  const draw = async () => {
    const { data } = await sb.from('comments').select('id,body,created_at,author,profiles(username,display_name)').eq('post_id', postId).order('created_at');
    box.innerHTML = (data || []).map((c) => `<div class="row" style="align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)"><div class="grow"><b>${esc(nameOf(c.profiles))}</b> <span class="muted">@${esc(c.profiles.username)} · ${timeStr(c.created_at)}</span><div class="post-body" style="margin:2px 0 0">${esc(c.body)}</div></div>${c.author === me.id ? `<button class="link" data-dc="${c.id}">Удалить</button>` : ''}</div>`).join('')
      + `<div class="row" style="margin-top:8px"><input class="in" id="ci" maxlength="1000" placeholder="Ваш комментарий"><button class="btn sm" id="cs">Отправить</button></div>`;
    box.querySelector('#cs').onclick = async () => {
      const body = box.querySelector('#ci').value.trim(); if (!body) return;
      const { error } = await sb.from('comments').insert({ post_id: postId, body });
      toast(error ? 'Не удалось отправить' : 'Комментарий добавлен', !!error); draw();
    };
    box.querySelectorAll('[data-dc]').forEach((b) => { b.onclick = async () => { await sb.from('comments').delete().eq('id', b.dataset.dc); draw(); }; });
  };
  draw();
}

/* ---------- чаты ---------- */
async function loadChats() {
  const v = view(); if (!v) return;
  if (!v.dataset.ready) {
    v.dataset.ready = 1;
    v.innerHTML = `<h1>Чаты</h1><div class="card"><div class="row"><input id="q" class="in" placeholder="Найти по юзернейму" autocapitalize="none"></div><div id="found" style="margin-top:8px"></div></div>
    <div class="card list" id="convs"></div>`;
    document.getElementById('q').oninput = async (e) => {
      const q = e.target.value.trim().replace(/^@/, '').replace(/[%_\\]/g, (c) => '\\' + c);
      const f = document.getElementById('found');
      if (!q) { f.innerHTML = ''; return; }
      const { data } = await sb.from('profiles').select('id,username,display_name').ilike('username', q + '%').neq('id', me.id).limit(8);
      f.innerHTML = data && data.length ? data.map((p) => `<button class="item" data-u="${p.id}">${ava(p)}<div class="grow"><div class="name">${esc(nameOf(p))}</div><div class="muted">@${esc(p.username)}</div></div></button>`).join('') : '<div class="muted">Никого не найдено</div>';
      data && data.forEach((p) => { pcache[p.id] = p; });
      f.onclick = (ev) => { const b = ev.target.closest('[data-u]'); if (b) go('chat', pcache[b.dataset.u]); };
    };
  }
  const { data } = await sb.from('messages').select('sender,recipient,body,created_at').or(`sender.eq.${me.id},recipient.eq.${me.id}`).order('created_at', { ascending: false }).limit(300);
  const last = {};
  (data || []).forEach((m) => { const o = m.sender === me.id ? m.recipient : m.sender; if (!last[o]) last[o] = m; });
  const ids = Object.keys(last);
  await Promise.all(ids.map(getProfile));
  const box = document.getElementById('convs'); if (!box) return;
  box.innerHTML = ids.length ? ids.map((id) => { const p = pcache[id], m = last[id]; return p ? `<button class="item" data-u="${id}">${ava(p)}<div class="grow"><div class="name">${esc(nameOf(p))}</div><div class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.sender === me.id ? 'Вы: ' : ''}${esc(m.body)}</div></div><span class="muted">${timeStr(m.created_at)}</span></button>` : ''; }).join('') : '<div class="muted" style="padding:16px">Диалогов пока нет. Найдите друга по юзернейму выше.</div>';
  box.onclick = (ev) => { const b = ev.target.closest('[data-u]'); if (b) go('chat', pcache[b.dataset.u]); };
}
function bubble(m) {
  const mine = m.sender === me.id;
  return `<div class="b ${mine ? 'me' : 'it'}">${esc(m.body)}<small>${timeStr(m.created_at)}</small></div>`;
}
function addBubble(m) {
  const box = document.getElementById('msgs'); if (!box) return;
  box.insertAdjacentHTML('beforeend', bubble(m));
  box.scrollTop = box.scrollHeight;
}
async function renderChat() {
  const o = chatWith;
  $app.innerHTML = `<div class="chat"><div class="chat-head"><button class="btn ghost sm" id="back" aria-label="Назад">←</button>${ava(o)}<div class="grow"><div class="name">${esc(nameOf(o))}</div><div class="muted">@${esc(o.username)}</div></div></div>
  <div class="msgs" id="msgs"></div>
  <form class="composer" id="f"><input class="in" id="mt" maxlength="4000" placeholder="Сообщение" autocomplete="off"><button class="btn">Отправить</button></form></div>`;
  document.getElementById('back').onclick = () => go('chats');
  const { data } = await sb.from('messages').select('id,sender,recipient,body,created_at')
    .or(`and(sender.eq.${me.id},recipient.eq.${o.id}),and(sender.eq.${o.id},recipient.eq.${me.id})`).order('created_at').limit(200);
  const box = document.getElementById('msgs'); if (!box) return;
  box.innerHTML = (data || []).map(bubble).join('') || '<div class="muted" style="text-align:center">Напишите первое сообщение</div>';
  box.scrollTop = box.scrollHeight;
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    const i = document.getElementById('mt'); const body = i.value.trim(); if (!body) return;
    i.value = '';
    const { data: m, error } = await sb.from('messages').insert({ recipient: o.id, body }).select().single();
    if (error) { i.value = body; return toast('Не удалось отправить', true); }
    if (box.querySelector('.muted')) box.innerHTML = '';
    addBubble(m);
  };
  document.getElementById('mt').focus();
}

/* ---------- профиль ---------- */
function renderProfile() {
  view().innerHTML = `<h1>Профиль</h1><div class="card" style="display:flex;flex-direction:column;gap:12px">
    <div class="row">${ava(me)}<div class="grow"><div class="name" style="font-size:20px">${esc(nameOf(me))}</div><div class="muted">@${esc(me.username)}</div></div></div>
    <label><div class="muted"><b>Отображаемое имя</b></div><input id="dn" class="in" maxlength="40" value="${esc(me.display_name || '')}" placeholder="${esc(me.username)}"></label>
    <div><button class="btn" id="sv">Сохранить</button></div></div>
    <div class="card"><button class="btn ghost" id="out">Выйти из аккаунта</button></div>`;
  document.getElementById('sv').onclick = async () => {
    const display_name = document.getElementById('dn').value.trim() || null;
    const { error } = await sb.from('profiles').update({ display_name }).eq('id', me.id);
    if (error) return toast('Не удалось сохранить', true);
    me.display_name = display_name; pcache[me.id] = me; toast('Профиль сохранён'); renderProfile();
  };
  document.getElementById('out').onclick = async () => {
    if (channel) sb.removeChannel(channel);
    await sb.auth.signOut(); me = null; showAuth();
  };
}

if (!configured) showSetup(); else start();
</script>
</body>
</html>
