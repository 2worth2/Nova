<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Unbounded:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0A;--surface:#131316;--surface2:#1D1D22;--line:#2C3242;--ink:#F7F7F7;--muted:#8D9099;--danger:#F27470;--gold:#E2C275;--ok:#4CC38A;--glass:rgba(12,12,14,.72);--glass-line:rgba(247,247,247,.08);--shadow:0 10px 30px rgba(0,0,0,.55);--glow:0 0 24px rgba(90,200,250,.26);--lt:50%;--accent:#4AA8FF;--on-accent:#FFFFFF;--accent-deep:#0C1D3D;--accent-soft:rgba(90,200,250,.12);--accent-ink:#9CD4FE;--neon:var(--accent-ink);--neon-glow:color-mix(in srgb,var(--accent) 50%,transparent);--font-display:'Unbounded',Rubik,system-ui,sans-serif;--font-mono:'JetBrains Mono',Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 Rubik,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:color-mix(in srgb,var(--accent) 32%,transparent)}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
button{cursor:pointer}
h1{margin:0;font-size:30px;line-height:1.15;font-weight:600;font-family:var(--font-display);letter-spacing:-.02em}
h2{margin:0;font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 110px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.in{width:100%;min-height:48px;padding:10px 18px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--ink) 4%,var(--bg));transition:border-color .15s,box-shadow .15s}
.in:focus{border-color:color-mix(in srgb,var(--accent) 60%,var(--line));outline:none;box-shadow:var(--glow)}
textarea.in{resize:vertical;min-height:80px;border-radius:20px}
.btn{min-height:48px;padding:0 24px;border:1px solid var(--accent);border-radius:999px;background:color-mix(in srgb,var(--accent) 22%,#05070B);color:#fff;font-weight:600;letter-spacing:.01em;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s ease,box-shadow .2s,background .15s,filter .15s}
.btn:hover{box-shadow:var(--glow);filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:color-mix(in srgb,var(--ink) 4%,var(--bg));color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2);box-shadow:none;filter:none}
.btn.sm{min-height:38px;padding:0 16px;font-size:14px}
.btn.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.bad{background:var(--danger);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--danger);font-weight:600;font-size:14px}
.row{display:flex;align-items:center;gap:12px}
.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:12px}
.avw{position:relative;display:inline-flex;flex:none}
.avw .dot{display:none;position:absolute;right:0;bottom:0;width:28%;min-width:10px;max-width:18px;aspect-ratio:1;border-radius:50%;background:var(--ok);border:2px solid var(--surface);z-index:2}
.avw.on .dot{display:block}
.ava{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;overflow:hidden;position:relative}
.ava img{width:100%;height:100%;object-fit:cover}
.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;max-width:100%}
.name>span:first-child{overflow:hidden;text-overflow:ellipsis}
.post-body{white-space:pre-wrap;word-break:break-word;margin:8px 0}
.pimg{display:block;max-width:100%;max-height:480px;border-radius:18px;margin:8px 0;object-fit:contain;background:var(--surface2)}
.link{background:none;border:none;color:var(--accent-ink);font-weight:700;padding:6px 0}
.tag{padding:3px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:1px;text-transform:uppercase}
.auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.auth .card{width:100%;max-width:400px;padding:32px;display:flex;flex-direction:column;gap:16px;border-radius:20px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.01em}
.logo i{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#05070B;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:16px;box-shadow:var(--glow)}
nav{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom));pointer-events:none;z-index:20}
nav div{pointer-events:auto;display:flex;gap:2px;max-width:420px;margin:0 auto;padding:5px;border-radius:28px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6)}
nav button{flex:1;min-height:48px;border:none;border-radius:22px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:flex .2s,background .2s}
nav button.on{flex:2;background:var(--accent-soft);color:var(--accent-ink)}
nav button.pulse{animation:mnav 1.2s ease 1}
@keyframes mnav{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
nav svg{width:24px;height:24px;flex:none}.chat{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:0 auto}
.chat-head{padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:var(--surface)}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.b{max-width:78%;padding:10px 16px;border-radius:20px;white-space:pre-wrap;word-break:break-word}
.b.me{align-self:flex-end;background:var(--accent);color:#FFFFFF;border-bottom-right-radius:6px;box-shadow:0 2px 16px color-mix(in srgb,var(--accent) 26%,transparent)}
.b.it{align-self:flex-start;background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:6px}
.b small{display:block;opacity:.7;font-size:11px;margin-top:2px}
.composer{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
/* чаты в две панели на широких экранах (как в Slasherchat) */
.duo{display:none;height:100dvh;padding-bottom:96px}
@media (min-width:1000px){
  .duo{display:flex}
  .duo-l{width:460px;flex:none;overflow-y:auto;padding:14px 12px 20px;border-right:1px solid var(--line)}
  .duo-l h1{font-size:22px;padding:2px 4px 10px}
  .duo-r{flex:1;min-width:0;display:flex}
  .duo-r .chat{flex:1;height:auto;max-width:none;border-left:1px solid var(--line)}
  .duo-r .chat-head #back{display:none}
  .duo-empty{margin:auto;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:30px}
  .duo-empty b{font-size:16px}
  .duo-l .item.on{background:var(--accent-soft)}
}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;border:none;border-bottom:1px solid var(--line);background:transparent}
.list{padding:0;overflow:hidden}
.list .item:last-child{border-bottom:none}
.banner{height:clamp(150px,30vw,190px);background-size:cover;background-position:center;position:relative;overflow:hidden}
.banner img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-drag:none}
input[type=range]{width:100%;accent-color:var(--accent)}
.pad{padding:0 20px 20px}
.lift{margin-top:-40px;position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lift .ava{border:4px solid var(--surface);width:84px;height:84px;font-size:32px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
/* профиль в стиле Slasher: баннер, аватар внахлёст, инфо-строки, вкладки */
.pf{background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.pf-ban{height:clamp(150px,32vw,210px);background-size:cover;background-position:center;position:relative}
.pf-ban::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 52%,var(--surface) 100%)}
.pf-avw{position:relative;z-index:2;display:inline-flex;margin:-56px 0 0 4px}
.pf-avw .ava{width:96px;height:96px;font-size:36px;border:4px solid var(--surface)}
.pf-pad{padding:0 18px 18px}
.pf-name{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:.01em}
.pf-sub{color:var(--muted);font-size:13px;margin-top:3px}
.pf-also{margin-top:3px;font-size:13px;color:var(--muted)}
.pf-also .pfa{color:var(--ink);font-weight:600}
.pfn{margin-top:8px}
.pfn b{display:block;font-size:15px;color:var(--ink)}
.pfn span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
#pfNums:empty{display:none}
.pf-meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:10px}
.pf-tabs{display:flex;gap:10px;justify-content:center;margin:16px 0 14px}
.pf-tab{padding:10px 24px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--muted)}
.pf-tab.on{background:var(--surface);color:var(--ink);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
/* подарки в профиле: крупные цветные карточки как в Slasher */
.sggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.sgc{position:relative;aspect-ratio:1;border-radius:22px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid rgba(255,255,255,.14);cursor:pointer;padding:0;color:#fff;font:inherit}
.sgc::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.13) 1.4px,transparent 1.5px);background-size:15px 15px}
.sgc .gart{position:relative;z-index:1;filter:drop-shadow(0 10px 16px rgba(0,0,0,.35))}
.sgc .sgnum{position:absolute;top:8px;right:10px;z-index:2;font-size:12px;font-weight:800;font-family:var(--font-mono);color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.sgc .sgpin{position:absolute;top:7px;left:9px;z-index:2;font-size:15px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.sgc .sgcrown{position:absolute;bottom:8px;right:10px;z-index:2;font-size:15px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.sgc .sgname{position:absolute;bottom:9px;left:10px;right:10px;z-index:2;font-size:11px;font-weight:600;color:rgba(255,255,255,.94);text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* волновой плеер профиля */
/* плеер профиля: компактная плашка + раскрывающаяся волна */
.wp{padding:12px 14px}
.wp-top{display:flex;align-items:center;gap:12px;min-width:0}
.wp-cov{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent-deep));display:flex;align-items:center;justify-content:center;font-size:18px}
.wp-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wp-sub{color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wp-time{font-family:var(--font-mono);font-size:12px;color:var(--muted);flex:none;min-width:34px;text-align:right}
.wp-play{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);flex:none;display:flex;align-items:center;justify-content:center;box-shadow:var(--glow);cursor:pointer;border:none;transition:transform .15s ease,filter .15s ease}
.wp-play svg{width:16px;height:16px;display:block}
.wp-play:hover{filter:brightness(1.12)}
.wp-play:active{transform:scale(.9)}
.wp-fold{overflow:hidden;max-height:0;opacity:0;transition:max-height .28s ease,opacity .28s ease,margin .28s ease}
.wp.playing .wp-fold{max-height:110px;opacity:1;margin-top:10px}
.wp-wave{display:block;width:100%;height:40px;cursor:pointer;touch-action:none}
/* громкость: тонкий трек с заполнением, белая ручка (в стиле shadcn-слайдера) */
.wp-volw{display:flex;align-items:center;gap:10px;margin-top:10px;color:var(--muted)}
.wp-ico{font-size:14px;opacity:.7;flex:none}
.wp-vol{-webkit-appearance:none;appearance:none;flex:1;height:16px;background:transparent;cursor:pointer;--fill:100%}
.wp-vol::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:linear-gradient(to right,var(--accent) var(--fill),var(--surface2) var(--fill))}
.wp-vol::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-4px;box-shadow:0 1px 4px rgba(0,0,0,.55)}
.wp-vol::-moz-range-track{height:6px;border-radius:999px;background:var(--surface2)}
.wp-vol::-moz-range-progress{height:6px;border-radius:999px;background:var(--accent)}
.wp-vol::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.55)}
/* мини-плеер сверху — стеклянная панель в стиле Slasherchat */
.wmini{position:fixed;left:50%;transform:translateX(-50%);top:10px;width:min(1360px,calc(100% - 20px));z-index:40;display:none;flex-wrap:wrap;align-items:center;gap:10px;min-height:54px;padding:8px 12px;border-radius:16px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--glass-line);box-shadow:0 14px 44px rgba(0,0,0,.55);animation:wdown .3s cubic-bezier(.2,.9,.35,1.2)}
@keyframes wdown{from{transform:translateX(-50%) translateY(-14px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
body.wtop{padding-top:72px}
body.wtop .chat{height:calc(100dvh - 72px)}
body.wtop .duo{height:calc(100dvh - 72px)}
.wm-step{width:30px;height:30px;border:none;border-radius:50%;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.wm-step:hover{color:var(--ink)}
.wm-play{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--glass-line);background:var(--surface);color:var(--ink);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0;transition:transform .15s ease,filter .15s ease}
.wm-play:hover{filter:brightness(1.3)}
.wm-play:active{transform:scale(.92)}
.wm-cov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.wm-cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wm-pi{position:relative;z-index:1;display:flex;filter:drop-shadow(0 1px 3px rgba(0,0,0,.75))}
.wm-pi svg{width:14px;height:14px;display:block}
.wm-meta{display:flex;align-items:baseline;gap:10px;flex:0 1 auto;min-width:0}
.wm-name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wm-timet{font-size:12px;color:var(--muted);flex:none;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.wm-seek{-webkit-appearance:none;appearance:none;flex:1 1 220px;min-width:180px;height:18px;background:transparent;cursor:pointer;--played:0%}
.wm-seek::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:linear-gradient(to right,var(--ink) var(--played),rgba(141,144,153,.32) var(--played))}
.wm-seek::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;margin-top:-4.5px;box-shadow:0 1px 4px rgba(0,0,0,.55)}
.wm-seek::-moz-range-track{height:4px;border-radius:999px;background:rgba(141,144,153,.32)}
.wm-seek::-moz-range-progress{height:4px;border-radius:999px;background:var(--ink)}
.wm-seek::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.55)}
.wm-ico{width:30px;height:30px;border:none;border-radius:50%;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0;transition:color .15s ease}
.wm-ico:hover{color:var(--ink)}
.wm-ico.on{color:var(--accent)}
.wm-close:hover{color:var(--danger)}
.wm-speed{min-width:34px;height:26px;padding:0 8px;border:none;border-radius:999px;background:transparent;color:var(--muted);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums;cursor:pointer;flex:none}
.wm-speed:hover{color:var(--ink)}
@media (max-width:680px){.wm-step,.wm-speed,[data-wm="loop"],[data-wm="eq"]{display:none}.wm-meta{flex:1 1 auto}.wm-name{font-size:12.5px}.wm-seek{min-width:60px;flex-basis:100px}body.wtop{padding-top:64px}body.wtop .chat{height:calc(100dvh - 64px)}body.wtop .duo{height:calc(100dvh - 64px)}}
/* «NumberFlow»: плавно перетекающие числа */
.fnum{font-variant-numeric:tabular-nums;display:inline-block;transition:filter .12s}
.opt{display:flex;flex-direction:column;align-items:center;gap:8px;width:92px;padding:10px 6px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:12px;color:var(--muted);text-align:center}
.opt.sel{border-color:var(--accent)}
.opt:disabled{opacity:.45}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.sw button{width:46px;height:26px;border-radius:13px;border:none;background:var(--muted);position:relative;flex:none}
.sw button::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw button.on{background:var(--accent)}
.sw button.on::after{left:23px}
.pop{max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.nm-rose{--c:#C2255C}.nm-blue{--c:#1C5FD4}.nm-violet{--c:#6741D9}.nm-gold{--c:#8A5A00}
.nm-rose,.nm-blue,.nm-violet,.nm-gold{color:color-mix(in srgb,var(--c),#fff var(--lt))}
.nm-grad{background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:nmshift 4s linear infinite}
.nm-aurora{background-image:linear-gradient(90deg,#34D399,#3B82F6,#8B5CF6,#34D399)}
.nm-sunset{background-image:linear-gradient(90deg,#F97316,#EC4899,#F59E0B,#F97316)}
.nm-neon{color:var(--neon);text-shadow:0 0 6px var(--neon-glow),0 0 14px var(--neon-glow)}
.nm-jade{color:#0FAF8A;text-shadow:0 0 8px rgba(52,211,153,.55)}
.nm-pinkn{color:#E0457B;text-shadow:0 0 6px rgba(224,69,123,.6),0 0 14px rgba(224,69,123,.35)}
.nm-dymka{color:#8B5CF6;text-shadow:0 0 10px rgba(139,92,246,.6),0 0 22px rgba(139,92,246,.3)}
.nm-fire{color:#F59E0B;text-shadow:0 0 7px rgba(249,115,22,.65),0 0 16px rgba(239,68,68,.4)}
.nm-icy{color:#38BDF8;text-shadow:0 0 8px rgba(56,189,248,.55),0 0 18px rgba(224,242,254,.35)}
.nm-pixel{color:var(--ink);text-shadow:2px 0 0 color-mix(in srgb,#22D3EE 75%,transparent),-2px 0 0 color-mix(in srgb,#4AA8FF 75%,transparent),0 2px 0 color-mix(in srgb,#22D3EE 55%,transparent),0 -2px 0 color-mix(in srgb,#4AA8FF 55%,transparent)}

/* ---------- конфетти: confetti() обычный салют, confetti(2) большой золотой ---------- */
const CONF_COLORS = ['#4AA8FF', '#9CD4FE', '#E2C275', '#F27470', '#4CC38A', '#F7F7F7', '#B388FF', '#FFD166'];
const CONF_GOLD = ['#E2C275', '#FFD700', '#FFC53D', '#FFE9A8', '#D4A017', '#F7F7F7'];
function confetti(mode) {
  try {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const W = window.innerWidth, H = window.innerHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cv = document.createElement('canvas');
    cv.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:120';
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    document.body.appendChild(cv);
    const big = mode === 2;
    const ps = [];
    const burst = (x, y, n, pow, golden) => {
      const P = golden ? CONF_GOLD : CONF_COLORS;
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
        const sp = pow * (0.5 + Math.random() * 0.8);
        ps.push({ x: x + (Math.random() - 0.5) * 70, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 16, w: 5 + Math.random() * 6, h: 9 + Math.random() * 8, c: P[(Math.random() * P.length) | 0], life: 1.8 + Math.random() * 1.5 });
      }
    };
    if (big) { burst(W / 2, H * 0.55, 130, 620, true); burst(W * 0.15, H, 40, 900, true); burst(W * 0.85, H, 40, 900, true); }
    else burst(W / 2, H * 0.62, 90, 560, false);
    let last = performance.now();
    const t0 = last;
    const step = (now) => {
      const dt = Math.min((now - last) / 1000, 0.05); last = now;
      ctx.clearRect(0, 0, W, H);
      let alive = 0;
      for (const p of ps) {
        p.vy += 1000 * dt; p.vx *= 0.995; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt;
        if (p.y > H + 30 || p.life <= 0) continue;
        alive++;
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.7));
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      if (alive > 0 && now - t0 < 7000) requestAnimationFrame(step);
      else cv.remove();
    };
    requestAnimationFrame(step);
  } catch (e) {}
}

/* ---------- картинки: сжатие и загрузка ---------- */
function prepImage(file, o) {
  return new Promise((resolve, reject) => {
    if (!/^image\//.test(file.type)) return reject(new Error('Выберите изображение или GIF'));
    if (file.type === 'image/gif') return file.size <= 2 * 1024 * 1024 ? resolve(file) : reject(new Error('GIF больше 2 МБ: выберите файл поменьше'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Не удалось прочитать файл')); };
    img.onload = () => {
      let w = img.width, h = img.height, sx = 0, sy = 0, sw = w, sh = h;
      if (o.square) { const m = Math.min(w, h); sx = (w - m) / 2; sy = (h - m) / 2; sw = sh = m; w = h = m; }
      const k = Math.min(1, o.max / Math.max(w, h));
      const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob((b) => b ? resolve(b) : reject(new Error('Не удалось сжать фото')), 'image/jpeg', o.q || 0.85);
    };
    img.src = url;
  });
}
async function uploadImage(file, o) {
  const blob = await prepImage(file, o);
  const ext = blob.type === 'image/gif' ? 'gif' : 'jpg';
  const path = me.id + '/' + Date.now() + '.' + ext;
  const { error } = await sb.storage.from('media').upload(path, blob, { contentType: blob.type });
  if (error) throw new Error('Не удалось загрузить файл');
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}

/* «NumberFlow»: число плавно перетекает от старого значения к новому */
const GR_SEEN = {};
function flowNum(el, to, from, suffix) {
  el._fv = to; // последнее показанное значение — для живых обновлений
  if (from == null || !isFinite(from) || from === to) { el.textContent = Number(to).toLocaleString('ru-RU') + (suffix || ''); return; }
  const t0 = performance.now(), dur = 750;
  const fv = (v) => Math.round(v).toLocaleString('ru-RU') + (suffix || '');
  el.classList.add('fnum');
  const step = (now) => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fv(from + (to - from) * e);
    el.style.opacity = String(0.75 + 0.25 * Math.sin(Math.PI * k)); // лёгкая пульсация в такт переливу
    if (k < 1) requestAnimationFrame(step);
    else el.style.opacity = '';
  };
  requestAnimationFrame(step);
}

/* волновой плеер: рисуем настоящую форму волны трека, заливаем по прогрессу, драг — перемотка */
const WAVE_CACHE = {}; // src -> { buf, peaks } либо null (не удалось)
let WAVE_AC = null;
async function waveLoad(src) {
  if (src in WAVE_CACHE) return WAVE_CACHE[src];
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) throw new Error('no webaudio');
    WAVE_AC = WAVE_AC || new AC();
    if (WAVE_AC.state === 'suspended') WAVE_AC.resume().catch(() => {});
    const ab = await (await fetch(src)).arrayBuffer();
    const buf = await WAVE_AC.decodeAudioData(ab);
    const ch = buf.getChannelData(0), N = 64, block = Math.floor(ch.length / N) || 1;
    const peaks = [];
    for (let i = 0; i < N; i++) {
      let m = 0;
      for (let j = i * block, end = (i + 1) * block; j < end && j < ch.length; j += 16) { const v = Math.abs(ch[j]); if (v > m) m = v; }
      peaks.push(m);
    }
    const mx = Math.max.apply(null, peaks) || 1;
    WAVE_CACHE[src] = { buf, peaks: peaks.map((p) => Math.max(0.1, p / mx)) };
  } catch (e) {
    console.warn('wave decode:', (e && e.message) || e);
    WAVE_CACHE[src] = null;
  }
  return WAVE_CACHE[src];
}
function waveDraw(cv, peaks, frac, gapW) {
  try {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = cv.clientWidth || 200, h = cv.clientHeight || 44;
    if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const N = peaks.length, gap = gapW != null ? gapW : 2;
    // сколько баров реально влезает по ширине — рисуем ровно, без обрезки справа
    const nb = Math.max(10, Math.min(N, Math.floor(w / (2 + gap))));
    const bw = Math.max(1.5, (w - gap * (nb - 1)) / nb);
    const accent = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#4AA8FF').trim() || '#4AA8FF';
    for (let i = 0; i < nb; i++) {
      const p = peaks[Math.round(i * (N - 1) / Math.max(1, nb - 1))];
      const bh = Math.max(3, p * (h - 6));
      const x = i * (bw + gap), y = (h - bh) / 2;
      ctx.fillStyle = i / nb < frac ? accent : 'rgba(141,144,153,.32)';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, bw, bh, Math.min(2, bw / 2)); else ctx.rect(x, y, bw, bh);
      ctx.fill();
    }
  } catch (e) {}
}

function blip() {
  if (Date.now() - lastBlip < 4000) return;
  lastBlip = Date.now();
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!blipCtx) blipCtx = new AC();
    const c = blipCtx, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0.001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18, c.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.15);
    o.start(); o.stop(c.currentTime + 0.16);
  } catch (e) {}
}

  if (!(await rxCheck())) return out;
  const clean = ids.filter(Boolean);
  if (!clean.length) return out;
  const { error, data } = await sb.from('reactions').select('target_id,emoji,user_id').in('target_id', clean).eq('target_kind', kind).limit(3000);
  if (error || !(data || []).length) return out;
  (data || []).forEach((r) => { const a = out[r.target_id] = out[r.target_id] || {}; const e = a[r.emoji] = a[r.emoji] || { n: 0, mine: false }; e.n++; if (r.user_id === me.id) e.mine = true; });
  return out;
}
async function refreshRx(kind, id) {
  const map = await loadReactions(kind, [id]);
  const spot = document.querySelector(`[data-msg="${id}"] .rxs`);
  if (spot) spot.innerHTML = rxInner(map[id] || {}, id);
}
let RX_OK = null, RX_T = 0;
const rxMissing = (e) => e && (e.code === '42P01' || e.code === 'PGRST205' || /could not find the table|does not exist/i.test(e.message || ''));
async function rxCheck() {
  if (RX_OK === true) return true;
  if (RX_OK === false && Date.now() - RX_T < 30000) return false;
  try { const { error } = await sb.from('reactions').select('id').limit(1); RX_OK = !error || !rxMissing(error); } catch (e) { RX_OK = false; }
  RX_T = Date.now();
  return RX_OK;
}
async function toggleReaction(kind, id, emoji) {
  if (!(await rxCheck())) return toast('Реакции появятся после запуска migrate_001.sql (см. README)', true);
  const { data } = await sb.from('reactions').select('id').eq('target_kind', kind).eq('target_id', id).eq('emoji', emoji).eq('user_id', me.id).limit(1);
  if (data && data[0]) { const r = await sb.from('reactions').delete().eq('id', data[0].id); if (r.error) toast('Не вышло', true); }
  else { const r = await sb.from('reactions').insert({ target_kind: kind, target_id: id, emoji }); if (r.error) toast(r.error.message || 'Не вышло', true); }
}
let DM_OK = null, DM_T = 0;
async function dmOk() {
  if (DM_OK === true) return true;
  if (DM_OK === false && Date.now() - DM_T < 60000) return false;
  try { const { error } = await sb.from('messages').select('image_url,read_at').limit(1); DM_OK = !error || !rxMissing(error); } catch (e) { DM_OK = false; }

const rpickDelete = async (id) => {
  const r = await sb.from('messages').delete().eq('id', id);
  if (r.error) return toast(r.error.message || 'Не удалось удалить', true);
  const el = document.querySelector(`[data-dm="1"][data-msg="${id}"]`);

let rxPicker = null;
function closePicker() { if (rxPicker) { rxPicker.remove(); rxPicker = null; } }
function openPicker(anchor, kind, id, canReply, canDelete) {
  closePicker();
  const p = document.createElement('div');
  p.className = 'rpick';
  const showReply = canReply && RX_OK === true;
  const showDel = kind === 'message' && canDelete;
  let page = 0;
  const draw = () => {
    p.innerHTML = RE_PAGES[page].map((e) => `<button data-pe="${e}">${e}</button>`).join('')
      + (showReply ? '<button data-pr="1" aria-label="Ответить">↩ Ответить</button>' : '')
      + (showDel ? '<button data-pd="1" aria-label="Удалить">🗑</button>' : '')
      + `<div class="rpdots">${RE_PAGES.map((_, i) => `<button data-rp="${i}" class="${i === page ? 'on' : ''}" aria-label="Страница реакций ${i + 1}"></button>`).join('')}</div>`;
  };
  draw();
  document.body.appendChild(p);
  const r = anchor.getBoundingClientRect();
  p.style.top = Math.max(12, Math.min(window.innerHeight - p.offsetHeight - 12, r.bottom + 6)) + 'px';
  p.style.left = Math.max(12, Math.min(window.innerWidth - p.offsetWidth - 12, r.left - 40)) + 'px';
  rxPicker = p;
  p.onclick = async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.rp != null) { page = +b.dataset.rp; draw(); return; }
    closePicker();
    if (b.dataset.pe) toggleReaction(kind, id, b.dataset.pe).then(() => refreshRx(kind, id));
    else if (b.dataset.pr && window.__startReply) window.__startReply(kind, id);
    else if (b.dataset.pd) await rpickDelete(id);
  };
  const off = (e) => { if (!p.contains(e.target)) { closePicker(); document.removeEventListener('pointerdown', off); } };
  setTimeout(() => document.addEventListener('pointerdown', off), 0);
}
async function resolveReplies(kind, items) {
  if (!(await rxCheck())) return {};
  const ids = [...new Set(items.map((m) => m.reply_to).filter(Boolean))];
  if (!ids.length) return {};
  const tb = kind === 'message' ? 'messages' : 'conv_posts';
  const cols = tb === 'messages' ? 'id,body,sender,created_at' : 'id,body,author,image_url,created_at';
  const { data } = await sb.from(tb).select(cols).in('id', ids);
  const out = {};
  (data || []).forEach((r) => { out[r.id] = r; if (r.sender) getProfile(r.sender); if (r.author) getProfile(r.author); });
  return out;
}
function draftInput(inp, key) {
  inp.value = getDraft(key);
  inp.addEventListener('input', () => setDraft(key, inp.value));
}

async function saveMe(patch, okText) {
  const { error } = await sb.from('profiles').update(patch).eq('id', me.id);
  if (error) { toast('Не удалось сохранить', true); return false; }
  Object.assign(me, patch); remember(me);
  if (okText) toast(okText);
  if ('hide_online' in patch) { applyPresence(); refreshPresence(); }
  return true;
}
function renderSettings() {
  const lock = (f) => f && !prem(me);
  view().innerHTML = `<div class="row"><button class="btn ghost sm" id="bk" aria-label="Назад">←</button><h1>Настройки</h1></div>
  <div class="card col"><h2>Профиль</h2>
    <label><div class="muted"><b>Отображаемое имя</b></div><input id="dn" class="in" maxlength="40" value="${esc(me.display_name || '')}" placeholder="${esc(me.username)}"></label>
    <label><div class="muted"><b>О себе</b> (до 200 символов)</div><textarea id="bio" class="in" maxlength="200">${esc(me.bio || '')}</textarea></label>
    <div><button class="btn" id="sv">Сохранить</button></div></div>
  <div class="card col"><h2>Музыка в профиле</h2>
    ${me.music_url ? player(me) : '<div class="muted">Добавьте песню в формате MP3 (до 10 МБ): её сможет послушать каждый, кто зайдёт в ваш профиль.</div>'}
    <div class="row wrapr"><label class="btn file">${me.music_url ? 'Заменить музыку' : 'Добавить музыку'}<input type="file" id="fm" accept=".mp3,audio/mpeg"></label>${me.music_url ? '<button class="btn ghost" id="rm">Удалить песню</button>' : ''}</div></div>
  <div class="card col"><h2>Аватар и баннер</h2>
    <div class="row wrapr">${av(me, 56)}<label class="btn ghost sm file">Аватар из галереи<input type="file" id="fa" accept="image/*"></label>${me.avatar_url ? '<button class="btn ghost sm" id="ra">Убрать</button>' : ''}</div>
    <div class="row wrapr"><label class="btn ghost sm file">Баннер из галереи<input type="file" id="fb" accept="image/*"></label>${me.banner_url ? '<button class="btn ghost sm" id="rb">Убрать</button>' : ''}</div>
    ${me.banner_url ? `<div class="muted">Положение и масштаб: перетащите картинку и подвигайте ползунок</div>
    <div class="banner" id="bprev" style="border-radius:14px;background:${bannerCss(me)};cursor:grab;touch-action:none">${bannerImg(me, 'bimg')}</div>
    <label><div class="muted">Масштаб: <span id="bzv">${numOr(me.banner_zoom, 1).toFixed(2)}</span>×</div><input type="range" id="bz" min="1" max="3" step="0.05" value="${numOr(me.banner_zoom, 1)}"></label>
    <div class="row wrapr"><button class="btn" id="bsv">Сохранить положение</button><button class="btn ghost" id="brs">Сбросить</button></div>` : ''}
    <div class="muted">Цвет баннера, если нет фото</div>
    <div class="opts">${Object.keys(BANNERS).map((k) => `<button class="opt ${me.banner_color === k ? 'sel' : ''}" data-bn="${k}" ${lock(BANNERS[k][1]) ? 'disabled' : ''}><span style="width:44px;height:24px;border-radius:8px;background:${BANNERS[k][0]}"></span>${k}${BANNERS[k][1] ? ' · Premium' : ''}</button>`).join('')}</div></div>
  <div class="card col"><h2>Рамка аватара <span class="muted">· часть рамок — Premium</span></h2>
    <div class="opts">${Object.keys(FRAMES).filter((k) => !FRAMES[k][2] || frameSeason(k)).map((k) => `<button class="opt ${(me.frame || 'none') === k ? 'sel' : ''}" data-fr="${k}" ${lock(FRAMES[k][1]) ? 'disabled' : ''}><span class="ava ${k === 'none' ? '' : 'fr-' + k}" style="background:${colorOf(me.username)}">${esc(me.username[0].toUpperCase())}</span>${FRAMES[k][0]}${FRAMES[k][1] ? ' · Premium' : ''}${FRAMES[k][2] ? ' · сейчас' : ''}</button>`).join('')}</div></div>
  <div class="card col"><h2>Цвет и эффекты имени <span class="muted">· Premium</span></h2>
    <div class="opts">${Object.keys(NAMEFX).map((k) => `<button class="opt ${me.name_color === k ? 'sel' : ''}" data-nc="${k}" ${k !== 'default' && !prem(me) ? 'disabled' : ''}><b class="${NAMEFX[k][1]}" style="font-size:17px">Аа</b>${NAMEFX[k][0]}${k !== 'default' ? ' · Premium' : ''}</button>`).join('')}</div></div>
  <div class="card col"><h2>Оформление</h2>
    <div class="opts">${[['auto', 'Как в системе'], ['light', 'Светлая'], ['dark', 'Тёмная']].map(([k, t]) => `<button class="opt ${theme.m === k ? 'sel' : ''}" data-tm="${k}">${t}</button>`).join('')}</div>
    <div class="muted">Цвет акцента</div>
    <div class="row wrapr" style="gap:8px">${ACCS.map((c) => `<button class="opt sq ${theme.a === c ? 'sel' : ''}" data-ta="${c}" style="background:${c}" aria-label="Цвет ${c}"></button>`).join('')}<label class="row muted" style="gap:6px">Свой <input type="color" id="tc" value="${theme.a || PAL.light.a}"></label><button class="btn ghost sm" id="tr">Сбросить</button></div>
    <div class="sw" style="margin-top:10px"><div><div><b>Уведомления и звук</b></div><div class="muted">Блип и браузерное уведомление, когда Nova в неактивной вкладке</div></div><button id="ntf" class="${notifyEnabled() ? 'on' : ''}" aria-label="Уведомления и звук"></button></div>
    <div class="muted">Оформление хранится в этом браузере.</div></div>
  <div class="card"><h2>Приватность</h2>
    <div class="sw" style="margin-top:8px"><div><div><b>Показывать, что я в сети</b></div><div class="muted">Если выключить, другие увидят «был(а) недавно»</div></div><button data-sw="hide_online" data-inv="1" class="${me.hide_online ? '' : 'on'}" aria-label="Показывать, что я в сети"></button></div>
    <div class="sw"><div><div><b>Показывать баланс GR всем</b></div><div class="muted">Если выключить, баланс виден только вам</div></div><button data-sw="gr_public" class="${me.gr_public ? 'on' : ''}" aria-label="Показывать баланс GR"></button></div></div>
  <div class="card col"><h2>Юзернейм</h2><div class="muted">Вход в аккаунт идёт по текущему юзернейму. Купленные юзернеймы можно сделать основными в Маркете.</div><div class="row wrapr"><input id="un" class="in grow" maxlength="32" autocapitalize="none" value="${esc(me.username)}" style="min-width:160px"><button class="btn" id="unb">Сменить</button></div></div>
  ${me.is_admin ? '<div class="card col" id="admin"></div>' : ''}
  <div class="card"><button class="btn ghost" id="out">Выйти из аккаунта</button></div>`;
  initWaves();
  document.getElementById('bk').onclick = () => go('profile');
  document.getElementById('sv').onclick = async () => {
    const ok = await saveMe({ display_name: document.getElementById('dn').value.trim() || null, bio: document.getElementById('bio').value.trim() || null }, 'Профиль сохранён');
    if (ok) renderSettings();
  };
  const pick = (id, field, o, text, extra) => { document.getElementById(id).onchange = async (e) => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try { const url = await uploadImage(f, o); if (await saveMe(Object.assign({ [field]: url }, extra), text)) renderSettings(); } catch (er) { toast(er.message, true); }
  }; };
  document.getElementById('fm').onchange = async (e) => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    if (!/\.mp3$/i.test(f.name) || (f.type && f.type !== 'audio/mpeg')) return toast('Выберите файл формата MP3', true);
    if (f.size > 10 * 1024 * 1024) return toast('Файл больше 10 МБ', true);
    toast('Загружаю песню…');
    const path = me.id + '/' + Date.now() + '.mp3', old = me.music_url;
    const { error } = await sb.storage.from('music').upload(path, f, { contentType: 'audio/mpeg' });
    if (error) return toast('Не удалось загрузить песню', true);
    const url = sb.storage.from('music').getPublicUrl(path).data.publicUrl;
    if (await saveMe({ music_url: url, music_title: f.name.replace(/\.mp3$/i, '').trim().slice(0, 80) || 'Без названия' }, 'Песня добавлена в профиль')) { dropMusic(old); renderSettings(); }
  };
  const rm = document.getElementById('rm');
  if (rm) rm.onclick = async () => { const old = me.music_url; if (await saveMe({ music_url: null, music_title: null }, 'Песня удалена')) { dropMusic(old); renderSettings(); } };
  pick('fa', 'avatar_url', { square: true, max: 256, q: 0.85 }, 'Аватар обновлён');
  pick('fb', 'banner_url', { max: 1000, q: 0.8 }, 'Баннер обновлён', { banner_x: 50, banner_y: 50, banner_zoom: 1 });
  const bp = document.getElementById('bprev');
  if (bp) {
    const img = document.getElementById('bimg'), zs = document.getElementById('bz');
    let x = numOr(me.banner_x, 50), y = numOr(me.banner_y, 50), z = numOr(me.banner_zoom, 1), drag = null;
    const apply = () => { img.setAttribute('style', bannerPos(x, y, z)); document.getElementById('bzv').textContent = z.toFixed(2); };
    const clamp = (n) => Math.max(0, Math.min(100, n));
    bp.onpointerdown = (e) => { drag = { px: e.clientX, py: e.clientY, x, y }; bp.setPointerCapture(e.pointerId); bp.style.cursor = 'grabbing'; };
    bp.onpointermove = (e) => { if (!drag) return; const r = bp.getBoundingClientRect(); x = clamp(drag.x - (e.clientX - drag.px) / r.width * 100 / z); y = clamp(drag.y - (e.clientY - drag.py) / r.height * 100 / z); apply(); };
    bp.onpointerup = bp.onpointercancel = () => { drag = null; bp.style.cursor = 'grab'; };
    zs.oninput = () => { z = parseFloat(zs.value); apply(); };
    document.getElementById('bsv').onclick = () => saveMe({ banner_x: +x.toFixed(1), banner_y: +y.toFixed(1), banner_zoom: +z.toFixed(2) }, 'Положение баннера сохранено');
    document.getElementById('brs').onclick = () => { x = 50; y = 50; z = 1; zs.value = 1; apply(); };
  }
  [['ra', 'avatar_url', 'Аватар убран'], ['rb', 'banner_url', 'Баннер убран']].forEach(([id, f, t]) => { const b = document.getElementById(id); if (b) b.onclick = async () => { if (await saveMe({ [f]: null }, t)) renderSettings(); }; });
  $app.querySelectorAll('[data-bn],[data-fr],[data-nc],[data-sw]').forEach((b) => {
    b.onclick = async () => {
      const d = b.dataset; let patch;
      if (d.bn) patch = { banner_color: d.bn }; else if (d.fr) patch = { frame: d.fr }; else if (d.nc) patch = { name_color: d.nc };
      else patch = { [d.sw]: d.inv ? !!me[d.sw] === false ? true : false : !me[d.sw] };
      if (d.sw === 'hide_online') patch = { hide_online: !me.hide_online };
      if (await saveMe(patch, 'Сохранено')) renderSettings();
    };
  });
  $app.querySelectorAll('[data-tm],[data-ta]').forEach((b) => { b.onclick = () => { setTheme(b.dataset.tm ? { m: b.dataset.tm } : { a: b.dataset.ta }); renderSettings(); }; });
  document.getElementById('tc').onchange = (e) => { setTheme({ a: e.target.value }); renderSettings(); };
  document.getElementById('tr').onclick = () => { setTheme({ m: 'auto', a: null }); renderSettings(); };
  const ntf = document.getElementById('ntf');
  if (ntf) ntf.onclick = async () => {
    const on = !notifyEnabled();
    if (on && window.Notification && Notification.permission === 'default') { try { await Notification.requestPermission(); } catch (e) {} }
    try { localStorage.setItem('nova_notify', on ? '1' : '0'); } catch (e) {}
    ntf.classList.toggle('on', on);
    if (on && window.Notification && Notification.permission === 'denied') toast('Браузер заблокировал уведомления: разрешите их для сайта в настройках браузера', true);
    if (on) blip();
  };
  document.getElementById('unb').onclick = async () => {
    const v = document.getElementById('un').value.trim().replace(/^@/, '');
    if (v === me.username) return;
    const { error } = await sb.rpc('change_username', { p_new: v });
    if (error) return toast(error.message || 'Не удалось сменить', true);
    await getProfile(me.id, true); toast('Юзернейм изменён: @' + me.username); renderSettings();
  };
  document.getElementById('out').onclick = async () => {
    if (channel) sb.removeChannel(channel);
    if (presCh) sb.removeChannel(presCh);
    clearInterval(seenTimer); await sb.auth.signOut(); me = null; showAuth();
  };
  if (me.is_admin) renderAdmin();
}

/* ---------- админ-панель: выбор любого пользователя ---------- */
let adminSel = null, adminAll = false;
function renderAdmin() {
  const box = document.getElementById('admin'); if (!box) return;
  const t = adminSel ? pcache[adminSel] : null;
  box.innerHTML = `<h2>Администрирование</h2><div class="muted">Найдите пользователя по юзернейму или откройте список всех.</div>
  <div class="row wrapr"><input id="aq" class="in grow" placeholder="@username или имя" autocapitalize="none" style="min-width:160px"><button class="btn ghost" id="aall">${adminAll ? 'Скрыть список' : 'Все пользователи'}</button></div>
  <div id="alist"></div>
  ${t ? `<div class="card col" style="background:var(--surface2)"><div class="row">${av(t, 48)}<div class="grow">${nm(t)}<div class="muted">@${esc(t.username)} · ${Number(t.gr).toLocaleString('ru-RU')} GR · <span data-seen="${t.id}">${esc(seenText(t))}</span></div></div><button class="btn ghost sm" id="aopen">Профиль</button></div>
    <div class="opts" style="gap:8px">
      <button class="btn sm ${t.is_premium ? 'on' : 'ghost'}" data-perk="premium">Premium</button>
      <button class="btn sm ${t.is_verified ? 'on' : 'ghost'}" data-perk="verified">Галочка</button>
      <button class="btn sm ${t.title === 'Модератор' ? 'on' : 'ghost'}" data-perk="mod">Модератор</button>
      ${t.id !== me.id ? `<button class="btn sm ${t.is_banned ? 'bad' : 'ghost'}" data-perk="ban">${t.is_banned ? 'Разблокировать' : 'Заблокировать'}</button>` : ''}</div>
    <div class="row wrapr"><input id="gra" class="in grow" placeholder="Сколько GR выдать" inputmode="numeric" style="min-width:140px"><button class="btn" id="grb">Выдать GR</button></div></div>` : '<div class="muted">Пользователь не выбран.</div>'}`;
  const list = document.getElementById('alist');
  const draw = (rows) => {
    rows.forEach(remember);
    list.innerHTML = rows.length ? `<div class="pop">${rows.map((p) => `<button class="item" data-pick="${p.id}">${av(p, 36)}<div class="grow">${nm(p)}<div class="muted">@${esc(p.username)} · ${Number(p.gr).toLocaleString('ru-RU')} GR</div></div></button>`).join('')}</div>` : '<div class="muted">Никого не найдено</div>';
    list.onclick = (e) => { const b = e.target.closest('[data-pick]'); if (b) { adminSel = b.dataset.pick; adminAll = false; renderAdmin(); } };
  };
  document.getElementById('aq').oninput = async (e) => {
    const q = e.target.value.trim().replace(/^@/, '').replace(/[%_,()\\]/g, '');
    if (!q) { list.innerHTML = ''; return; }
    const { data } = await sb.from('profiles').select(PCOLS).or(`username.ilike.%${q}%,display_name.ilike.%${q}%`).limit(10);
    draw(data || []);
  };
  document.getElementById('aall').onclick = () => { adminAll = !adminAll; renderAdmin(); };
  if (adminAll) sb.from('profiles').select(PCOLS).order('created_at').limit(200).then(({ data }) => draw(data || []));
  if (t) {
    document.getElementById('aopen').onclick = () => go('user', t);
    box.querySelectorAll('[data-perk]').forEach((b) => { b.onclick = async () => {
      const k = b.dataset.perk, a = { premium: t.is_premium, verified: t.is_verified, title: t.title || '', banned: t.is_banned };
      if (k === 'premium') a.premium = !a.premium; else if (k === 'verified') a.verified = !a.verified;
      else if (k === 'mod') a.title = a.title === 'Модератор' ? '' : 'Модератор'; else a.banned = !a.banned;
      const { error } = await sb.rpc('admin_set_user', { target: t.id, p_premium: a.premium, p_verified: a.verified, p_title: a.title, p_banned: a.banned });
      if (error) return toast('Не удалось изменить', true);
      await getProfile(t.id, true); if (t.id === me.id) me = pcache[me.id]; toast('Сохранено'); renderAdmin();
    }; });
    document.getElementById('grb').onclick = async () => {
      const n = parseInt(document.getElementById('gra').value, 10);
      if (!(n >= 1 && n <= 1000000)) return toast('Количество: от 1 до 1 000 000', true);
      const { error } = await sb.rpc('admin_grant_gr', { target: t.id, amount: n });
      if (error) return toast('Не удалось выдать GR', true);
      await getProfile(t.id, true); if (t.id === me.id) me = pcache[me.id]; toast('Выдано ' + n.toLocaleString('ru-RU') + ' GR: @' + t.username); renderAdmin();
    };
  }
}

const giftBg = (g) => {
  const c = (g.backdrop && GIFT_BG[g.backdrop]) || null;
  if (c) return `linear-gradient(150deg,hsl(${c[0]} ${c[1]}% ${c[2]}%),hsl(${c[0]} ${c[1]}% ${Math.max(c[2] - 16, 6)}%))`;
  const h = hueOf(g.backdrop || g.type || 'x');
  return `linear-gradient(150deg,hsl(${h} 55% 42%),hsl(${(h + 45) % 360} 60% 24%))`;
};
async function loadUserGifts(u) {
  if (!(await giftCheck())) return;
  const isMe = u.id === me.id;
  const sc = await gscOk();
  await giftCatalog();
  const { data } = sc
    ? await sb.from('user_gifts').select('*').eq('owner', u.id).order('showcase_pinned', { ascending: false }).order('id', { ascending: false }).limit(60)
    : await sb.from('user_gifts').select('*').eq('owner', u.id).order('id', { ascending: false }).limit(30);
  const box = document.getElementById('pas'); if (!box) return;
  const old = document.getElementById('pfGifts'); if (old) old.remove();
  const after = document.getElementById('pfAssets');
  const place = (el) => { if (after) box.insertBefore(el, after.nextSibling); else box.appendChild(el); };
  const all = data || [];
  if (!all.length) {
    if (!isMe) { const el = document.createElement('div'); el.id = 'pfGifts'; el.innerHTML = '<div class="muted" style="padding:2px 4px">Подарков пока нет.</div>'; place(el); }
    return;
  }
  const shown = isMe && PF_SHOW_HIDDEN ? all.filter((g) => g.showcase_hidden) : all.filter((g) => !g.showcase_hidden);
  const hiddenN = all.filter((g) => g.showcase_hidden).length;
  const sec = document.createElement('div');
  sec.id = 'pfGifts';
  sec.className = 'card col';
  sec.style.padding = '0';

let convs = {}, curConv = null;
const CCOLS = 'id,kind,title,about,username,owner,avatar_url,comments_on,members_write,system,created_at';
const isAdm = (c) => c.role === 'owner' || c.role === 'admin';
const canWrite = (c) => !me.is_banned && (isAdm(c) || (c.kind === 'group' && c.members_write));
async function loadConvs() {
  const { data } = await sb.from('conv_members').select(`role,last_read,convs(${CCOLS})`).eq('user_id', me.id);
  convs = {};
  (data || []).forEach((r) => { if (r.convs) convs[r.convs.id] = Object.assign(r.convs, { role: r.role, last_read: r.last_read }); });
}
async function joinConv(ref) {
  const { data, error } = await sb.rpc('conv_join', { p_ref: ref });
  if (error) return toast(error.message || 'Не удалось вступить', true);
  await loadConvs(); if (convs[data]) go('conv', convs[data]);
}
function convForm(kind) {
  const box = document.getElementById('cform');
  box.innerHTML = `<div class="card col" style="background:var(--surface2)"><h2>${kind === 'channel' ? 'Новый канал' : 'Новая группа'}</h2>
    <input id="ct" class="in" maxlength="60" placeholder="Название"><textarea id="ca" class="in" maxlength="300" placeholder="Описание (необязательно)"></textarea>
    <input id="cu" class="in" maxlength="32" autocapitalize="none" placeholder="Публичный юзернейм (необязательно)">
    <div class="muted">Без юзернейма доступ только по приватной ссылке.</div>
    <div class="row wrapr"><button class="btn" id="cok">Создать</button><button class="btn ghost" id="cx">Отмена</button></div></div>`;
  document.getElementById('cx').onclick = () => { box.innerHTML = ''; };
  document.getElementById('cok').onclick = async () => {
    const { data, error } = await sb.rpc('conv_create', { p_kind: kind, p_title: document.getElementById('ct').value, p_about: document.getElementById('ca').value, p_username: document.getElementById('cu').value.replace(/^@/, '') });
    if (error) return toast(error.message || 'Не удалось создать', true);
    await loadConvs(); if (convs[data]) go('conv', convs[data]);
  };
}
async function markRead(c) {
  c.last_read = new Date().toISOString();
  const { error } = await sb.from('conv_members').update({ last_read: c.last_read }).eq('conv', c.id).eq('user_id', me.id);
  if (error) console.warn('last_read:', error.message);
}
async function onConvPost({ new: m }) {
  const c = convs[m.conv]; if (!c) return;
  if (tab === 'conv' && curConv && curConv.id === m.conv) { await getProfile(m.author); addItem(m); markRead(c); }
  else if (m.author !== me.id) { toast('Новое в «' + c.title + '»'); if (tab === 'chats') loadChats(); }
  if (m.author !== me.id) {
    const a = await getProfile(m.author);
    notifyIncoming(c.title, (a ? '@' + a.username : 'участник') + ': ' + notifyText(m));
  }
}
const cmsg = (m, c, repMap, rxm) => {
  const a = pcache[m.author] || m.profiles || { username: '?', id: m.author }, mine = m.author === me.id, del = mine || isAdm(c);
  const rep = m.reply_to && repMap ? repMap[m.reply_to] : null;
  const repProf = rep ? (rep.author ? pcache[rep.author] : null) : null;
  const x = `${m.body.trim() ? `<div class="post-body" style="margin:4px 0">${esc(m.body)}</div>` : ''}${m.image_url ? `<img class="pimg" src="${esc(m.image_url)}" alt="" loading="lazy">` : ''}`;
  const d = del ? `<button class="link" style="color:${c.kind === 'group' ? 'inherit;opacity:.7;font-size:11px;padding:0' : 'var(--danger)'}" data-del="${m.id}">Удалить</button>` : '';
  const rq = c.kind === 'group' && !mine ? replyQuote(rep, repProf) : (c.kind === 'channel' ? replyQuote(rep, repProf) : '');
  if (c.kind === 'group') return `<div class="mrow" data-msg="${m.id}"><div class="b ${mine ? 'me' : 'it'}">${mine ? '' : `<b class="ell" style="display:block;font-size:13px">${esc(nameOf(a))}</b>`}${mine ? '' : rq}${mine ? rq : ''}${x}<small>${timeStr(m.created_at)} ${d}</small></div>${rxWrap(rxm && rxm[m.id] || {}, m.id)}</div>`;
  const n = m.conv_comments && m.conv_comments[0] ? m.conv_comments[0].count : 0;
  return `<article class="card" data-msg="${m.id}" data-id="${m.id}"><div class="muted">${timeStr(m.created_at)}</div>${x}<div class="row wrapr">${c.comments_on ? `<button class="link" data-cm="${m.id}">Комментарии (${n})</button>` : ''}${d}</div>${rxWrap(rxm && rxm[m.id] || {}, m.id)}<div class="cms"></div></article>`;
};
function addItem(m) {
  const box = document.getElementById('msgs'); if (!box || box.querySelector(`[data-msg="${m.id}"]`)) return;
  const e = box.querySelector('.muted.e, .es'); if (e) e.remove();
  box.insertAdjacentHTML('beforeend', cmsg(m, curConv));
  box.scrollTop = box.scrollHeight;
  if (m.reply_to) {
    resolveReplies('conv_posts', [m]).then((map) => {
      const el = box.querySelector(`[data-msg="${m.id}"]`);
      const bEl = el && (el.querySelector('.b') || el);
      if (bEl && map[m.reply_to] && !bEl.querySelector('.rq')) bEl.insertAdjacentHTML('afterbegin', replyQuote(map[m.reply_to], pcache[map[m.reply_to].author]));
    });
  }
}
async function renderConv(c) {
  curConv = c; chatWith = null;
  markDuoActive();
  const ch = c.kind === 'channel';
  const R = (wideChats() && document.getElementById('duoR')) || $app;
  R.innerHTML = `<div class="chat"><div class="chat-head"><button class="btn ghost sm" id="back" aria-label="Назад">←</button><button class="row grow link" id="ci" style="padding:0;text-align:left;min-width:0;color:var(--ink)">${convAv(c)}<span class="grow ell"><span class="name">${esc(c.title)}${c.system ? SVG_OK : ''}</span><span class="muted ell" id="cmem" style="display:block">${ch ? 'Канал' : 'Группа'}</span></span></button></div>
  <div class="msgs" id="msgs"></div>
  ${canWrite(c) ? `<form class="composer" id="f"><label class="btn ghost file" style="padding:0 14px" aria-label="Фото">📎<input type="file" id="cf" accept="image/*"></label><input class="in" id="mt" maxlength="4000" placeholder="${ch ? 'Новая публикация' : 'Сообщение'}" autocomplete="off"><button class="btn">Отправить</button></form>` : `<div class="composer muted" style="justify-content:center">${ch ? 'Публикуют только администраторы' : 'Писать могут только администраторы'}</div>`}</div>`;
  document.getElementById('back').onclick = () => go('chats');
  document.getElementById('ci').onclick = () => go('convinfo', c);
  sb.from('conv_members').select('user_id', { count: 'exact', head: true }).eq('conv', c.id).then(({ count }) => { const e = document.getElementById('cmem'); if (e && count != null) e.textContent = (ch ? 'Канал' : 'Группа') + ' · ' + count + ' уч.'; });
  const mig = await rxCheck();
  const Select = `id,conv,author${mig ? ',reply_to' : ''},body,image_url,created_at,profiles!author(${PCOLS}),conv_comments(count)`;
  let replyTarget = null, oldest = null, hasMore = false;
  const box = document.getElementById('msgs');
  const setReply = (id) => {
    const old = document.getElementById('reply'); if (old) old.remove();
    replyTarget = id;
    const src = box.querySelector(`[data-msg="${id}"] .b, [data-msg="${id}"]`);
    const bar = document.createElement('div');
    bar.id = 'reply'; bar.className = 'rbar';
    bar.innerHTML = `<div class="grow ell"><b>Ответ</b>· ${src ? esc(src.textContent.trim().slice(0, 70)) : ''}</div><button class="link" id="rx" aria-label="Отменить ответ">×</button>`;
    const f = document.getElementById('f');
    f.insertAdjacentElement('beforebegin', bar);
    document.getElementById('rx').onclick = () => { bar.remove(); replyTarget = null; };
    const i = document.getElementById('mt'); if (i) i.focus();
  };
  window.__startReply = (kind, id) => setReply(Number(id));
  const moreBtn = () => { const b = box.querySelector('#more'); if (b) b.remove(); if (hasMore) { box.insertAdjacentHTML('afterbegin', `<button class="btn ghost sm" id="more" style="align-self:center;margin-bottom:10px">Загрузить ещё</button>`); box.querySelector('#more').onclick = loadMore; } };
  async function loadMore() {
    if (!oldest) { hasMore = false; moreBtn(); box.scrollTop = 0; return; }
    const { data } = await sb.from('conv_posts').select(Select).eq('conv', c.id).lt('created_at', oldest).order('created_at', { ascending: false }).limit(30);
    const batch = data || [];
    if (!batch.length) { hasMore = false; moreBtn(); box.scrollTop = 0; return; }
    const firstHeight = box.scrollHeight;
    batch.forEach((m) => remember(m.profiles));
    const repMap = await resolveReplies('conv_posts', batch);
    const rxm = await loadReactions('conv_post', batch.map((x) => x.id));
    box.querySelector('#more') && box.querySelector('#more').remove();
    box.insertAdjacentHTML('afterbegin', batch.slice().reverse().map((m) => cmsg(m, c, repMap, rxm)).join(''));
    oldest = batch[batch.length - 1].created_at;
    if (batch.length < 30) hasMore = false;
    moreBtn();
    box.scrollTop = box.scrollHeight - firstHeight;
  }
  (async () => {
    const { data } = await sb.from('conv_posts').select(Select).eq('conv', c.id).order('created_at', { ascending: false }).limit(31);
    const batch = (data || []).slice(0, 30);
    hasMore = (data || []).length > 30;
    if (batch.length) oldest = batch[batch.length - 1].created_at;
    batch.forEach((m) => remember(m.profiles));
    if (curConv !== c) return;
    const repMap = await resolveReplies('conv_posts', batch);
    const rxm = await loadReactions('conv_post', batch.map((x) => x.id));
    box.innerHTML = batch.reverse().map((m) => cmsg(m, c, repMap, rxm)).join('') || '<div class="es" style="margin:auto"><b>' + (ch ? 'В канале пока пусто' : 'Здесь пока тихо') + '</b>' + (ch ? 'Первую публикацию сделают администраторы.' : 'Напишите первое сообщение.') + '</div>';
    moreBtn();
    box.scrollTop = box.scrollHeight; markRead(c);
  })();
  box.onclick = async (e) => {
    const t = e.target.closest('button');
    if (t && t.id) return;
    const rq = e.target.closest('.rq');
    if (rq && rq.dataset.rid) { jumpToQuote(rq.dataset.rid); return; }
    const row = e.target.closest('[data-msg]');
    if (t && t.dataset.cm) toggleComments(row.closest('article') || t.closest('article'), t.dataset.cm, 'conv_comments', 'post', isAdm(c));
    else if (t && t.dataset.del && confirm('Удалить?')) { const r = await sb.from('conv_posts').delete().eq('id', t.dataset.del); if (r.error) toast('Не удалось удалить', true); else t.closest('[data-msg]').remove(); }
    else if (t && t.dataset.rx) { const [id, emo] = t.dataset.rx.split('|'); await toggleReaction('conv_post', id, emo); refreshRx('conv_post', id); }
    else if (row) { const a = row.querySelector('.b') || row; openPicker(a, 'conv_post', row.dataset.msg, canWrite(c)); }
  };
  const f = document.getElementById('f'); if (!f) return;
  const i = document.getElementById('mt');
  if (i) draftInput(i, 'conv:' + c.id);
  const send = async (image_url) => {
    if (!i) return;
    const body = i.value.trim(); if (!body && !image_url) return;
    i.value = ''; setDraft('conv:' + c.id, '');
    const payload = { conv: c.id, body, image_url };
    if (replyTarget) payload.reply_to = replyTarget;
    const { data: m, error } = await sb.from('conv_posts').insert(payload).select().single();
    if (error) { if (i) i.value = body; setDraft('conv:' + c.id, body); return toast(me.is_banned ? 'Вы заблокированы' : 'Не удалось отправить', true); }
    replyTarget = null; const rb = document.getElementById('reply'); if (rb) rb.remove();
    addItem(m);
  };
  f.onsubmit = (e) => { e.preventDefault(); send(null); };
  document.getElementById('cf').onchange = async (e) => {
    const fl = e.target.files[0]; e.target.value = ''; if (!fl) return;
    try { toast('Загружаю…'); send(await uploadImage(fl, { max: 1280, q: 0.82 })); } catch (er) { toast(er.message, true); }
  };
}

async function renderConvInfo(c) {
  const ch = c.kind === 'channel', adm = isAdm(c), own = c.role === 'owner', sys = c.system;
  const { data: mem } = await sb.from('conv_members').select(`user_id,role,profiles!user_id(${PCOLS})`).eq('conv', c.id).limit(300);
  const v = view(); if (!v) return;
  (mem || []).forEach((r) => remember(r.profiles));
  const sw = (k, t, d, on) => `<div class="sw"><div><div><b>${t}</b></div><div class="muted">${d}</div></div><button data-cs="${k}" class="${on ? 'on' : ''}" aria-label="${t}"></button></div>`;
  const RL = { owner: 'Владелец', admin: 'Админ' };
  v.innerHTML = `<div class="row"><button class="btn ghost sm" id="bk" aria-label="Назад">←</button><h1>${ch ? 'Канал' : 'Группа'}</h1></div>
  <div class="card col"><div class="row">${convAv(c, 56)}<div class="grow"><div class="name" style="font-size:18px">${esc(c.title)}${sys ? SVG_OK : ''}</div><div class="muted">${c.username ? '@' + esc(c.username) + ' · ' : ''}${(mem || []).length} уч.</div></div></div>${c.about ? `<div class="post-body" style="margin:0">${esc(c.about)}</div>` : ''}</div>
  ${adm ? `<div class="card col"><h2>Настройки</h2>
    <input id="st" class="in" maxlength="60" value="${esc(c.title)}" placeholder="Название"><textarea id="sa" class="in" maxlength="300" placeholder="Описание">${esc(c.about || '')}</textarea>
    <div class="row wrapr"><label class="btn ghost sm file">Сменить аватар<input type="file" id="sf" accept="image/*"></label>${c.avatar_url ? '<button class="btn ghost sm" id="sr">Убрать аватар</button>' : ''}</div>
    ${ch ? sw('comments_on', 'Комментарии к постам', 'Если выключить, под постами нельзя комментировать', c.comments_on) : sw('members_write', 'Участники могут писать', 'Если выключить, писать смогут только админы', c.members_write)}
    <div><button class="btn" id="ss">Сохранить</button></div></div>` : ''}
  ${own && !sys ? `<div class="card col"><h2>Юзернейм</h2><div class="muted">С юзернеймом ${ch ? 'канал' : 'группу'} можно найти через поиск. Оставьте пустым, чтобы скрыть.</div><div class="row wrapr"><input id="su" class="in grow" maxlength="32" autocapitalize="none" value="${esc(c.username || '')}" placeholder="username" style="min-width:160px"><button class="btn" id="sub">Сохранить</button></div></div>` : ''}
  ${adm ? `<div class="card col"><h2>Ссылка-приглашение</h2><div class="row wrapr"><input id="il" class="in grow" readonly placeholder="Нажмите «Показать»" style="min-width:160px"><button class="btn ghost sm" id="ish">Показать</button><button class="btn ghost sm" id="icp">Копировать</button></div>${sys ? '' : '<button class="btn ghost sm" id="irs" style="align-self:flex-start">Сбросить ссылку</button>'}</div>` : ''}
  <div class="card list"><h2 style="padding:16px 16px 8px">Участники</h2>${(mem || []).map((r) => { const p = pcache[r.user_id]; if (!p) return ''; const can = !sys && r.role !== 'owner' && r.user_id !== me.id && (own || (c.role === 'admin' && r.role === 'member'));
    return `<div class="item" style="flex-wrap:wrap" data-m="${r.user_id}"><button class="link row grow" style="padding:0;text-align:left;min-width:0" data-op="${r.user_id}">${av(p, 36)}<span class="grow ell">${nm(p)}<span class="muted" style="display:block">@${esc(p.username)}</span></span></button>${RL[r.role] ? `<span class="tag">${RL[r.role]}</span>` : ''}
    ${own && !sys && r.role !== 'owner' ? `<button class="btn ghost sm" data-rl="${r.user_id}:${r.role === 'admin' ? 'member' : 'admin'}">${r.role === 'admin' ? 'Снять админа' : 'Сделать админом'}</button>` : ''}${can ? `<button class="btn ghost sm" style="color:var(--danger)" data-kick="${r.user_id}">Исключить</button>` : ''}</div>`; }).join('')}</div>
  ${sys ? '' : `<div class="card col">${own ? `<button class="btn bad" id="cdel">Удалить ${ch ? 'канал' : 'группу'}</button>` : '<button class="btn ghost" id="clv">Покинуть</button>'}</div>`}`;
  const $ = (id) => document.getElementById(id);
  const run = async (fn, args, ok, after) => { const { data, error } = await sb.rpc(fn, args); if (error) { toast(error.message || 'Не удалось', true); return null; } if (ok) toast(ok); if (after) await after(data); return data === undefined ? true : data; };
  const reload = async () => { await loadConvs(); if (convs[c.id]) go('convinfo', convs[c.id]); else go('chats'); };
  $('bk').onclick = () => go('conv', c);
  const flags = { comments_on: c.comments_on, members_write: c.members_write }, ava = { v: c.avatar_url };
  v.querySelectorAll('[data-cs]').forEach((b) => { b.onclick = () => { flags[b.dataset.cs] = !flags[b.dataset.cs]; b.classList.toggle('on', flags[b.dataset.cs]); }; });
  if ($('ss')) {
    $('ss').onclick = () => run('conv_update', { p_id: c.id, p_title: $('st').value, p_about: $('sa').value, p_comments: flags.comments_on, p_write: flags.members_write, p_avatar: ava.v }, 'Сохранено', reload);
    $('sf').onchange = async (e) => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { ava.v = await uploadImage(f, { square: true, max: 256, q: 0.85 }); $('ss').click(); } catch (er) { toast(er.message, true); } };
    if ($('sr')) $('sr').onclick = () => { ava.v = null; $('ss').click(); };
  }
  if ($('sub')) $('sub').onclick = () => run('conv_set_username', { p_id: c.id, p_name: $('su').value.replace(/^@/, '') }, 'Юзернейм сохранён', reload);
  if ($('ish')) {
    const link = (code) => { $('il').value = location.origin + location.pathname + '#j=' + code; };
    $('ish').onclick = () => run('conv_invite', { p_id: c.id }, null, link);
    $('icp').onclick = async () => { if (!$('il').value) await $('ish').onclick(); try { await navigator.clipboard.writeText($('il').value); toast('Ссылка скопирована'); } catch (e) { $('il').select(); } };
    if ($('irs')) $('irs').onclick = () => { if (confirm('Старая ссылка перестанет работать. Сбросить?')) run('conv_reset_invite', { p_id: c.id }, 'Ссылка сброшена', link); };
  }
  v.onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
    if (d.op) openUser(d.op);
    else if (d.rl) { const [u, r] = d.rl.split(':'); run('conv_set_role', { p_id: c.id, p_user: u, p_role: r }, 'Сохранено', reload); }
    else if (d.kick && confirm('Исключить участника?')) run('conv_kick', { p_id: c.id, p_user: d.kick }, 'Участник исключён', reload);
  };
  if ($('clv')) $('clv').onclick = () => { if (confirm('Покинуть?')) run('conv_leave', { p_id: c.id }, 'Вы вышли', async () => { await loadConvs(); go('chats'); }); };
  if ($('cdel')) $('cdel').onclick = () => { if (confirm('Удалить безвозвратно вместе со всеми сообщениями?')) run('conv_delete', { p_id: c.id }, 'Удалено', async () => { await loadConvs(); go('chats'); }); };
}

if (!configured) showSetup(); else start();
window.addEventListener('pagehide', () => { if (me) touchSeen(); });
document.addEventListener('visibilitychange', () => { if (me && document.visibilityState === 'hidden') touchSeen(); });
</script>
</body>
</html>
