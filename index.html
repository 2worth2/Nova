<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova</title>
<style>
:root{--bg:#F3F5F9;--surface:#fff;--surface2:#EEF1F6;--line:#DDE2EC;--ink:#121A2D;--muted:#566077;--danger:#B42318;--gold:#B7791F;--glass:rgba(255,255,255,.6);--glass-line:rgba(255,255,255,.75);--shadow:0 8px 24px rgba(18,26,45,.14);--lt:0%;--accent:#0F766E;--on-accent:#fff;--accent-soft:color-mix(in srgb,var(--accent) 16%,var(--surface));--accent-ink:color-mix(in srgb,var(--accent),var(--ink) 35%);--neon:var(--accent-ink);--neon-glow:color-mix(in srgb,var(--accent) 50%,transparent)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
h2{margin:0;font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 110px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.in{width:100%;min-height:44px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
textarea.in{resize:vertical;min-height:80px}
.btn{min-height:44px;padding:0 20px;border:none;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.bad{background:var(--danger);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--danger);font-weight:600;font-size:14px}
.row{display:flex;align-items:center;gap:12px}
.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:12px}
.avw{position:relative;display:inline-flex;flex:none}
.avw .dot{display:none;position:absolute;right:0;bottom:0;width:28%;min-width:10px;max-width:18px;aspect-ratio:1;border-radius:50%;background:#22C55E;border:2px solid var(--surface);z-index:2}
.avw.on .dot{display:block}
.ava{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;overflow:hidden;position:relative}
.ava img{width:100%;height:100%;object-fit:cover}
.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;max-width:100%}
.name>span:first-child{overflow:hidden;text-overflow:ellipsis}
.post-body{white-space:pre-wrap;word-break:break-word;margin:8px 0}
.pimg{display:block;max-width:100%;max-height:480px;border-radius:12px;margin:8px 0;object-fit:contain;background:var(--surface2)}
.link{background:none;border:none;color:var(--accent-ink);font-weight:700;padding:6px 0}
.tag{padding:2px 10px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);font-size:12px;font-weight:700}
.auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.auth .card{width:100%;max-width:400px;padding:32px;display:flex;flex-direction:column;gap:16px;border-radius:20px}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
.logo i{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-style:normal}
nav{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom));pointer-events:none;z-index:20}
nav div{pointer-events:auto;display:flex;gap:2px;max-width:420px;margin:0 auto;padding:5px;border-radius:28px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6)}
nav button{flex:1;min-height:48px;border:none;border-radius:22px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:flex .2s,background .2s}
nav button.on{flex:2;background:var(--accent-soft);color:var(--accent-ink)}
nav svg{width:24px;height:24px;flex:none}
.chat{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:0 auto}
.chat-head{padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:var(--surface)}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.b{max-width:78%;padding:8px 12px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.b.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.b.it{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.b small{display:block;opacity:.7;font-size:11px;margin-top:2px}
.composer{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;border:none;border-bottom:1px solid var(--line);background:transparent}
.list{padding:0;overflow:hidden}
.list .item:last-child{border-bottom:none}
.banner{height:clamp(150px,30vw,190px);background-size:cover;background-position:center;position:relative;overflow:hidden}
.banner img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-drag:none}
input[type=range]{width:100%;accent-color:var(--accent)}
.pad{padding:0 20px 20px}
.lift{margin-top:-40px;position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lift .ava{border:4px solid var(--surface);width:84px;height:84px;font-size:32px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;gap:8px;width:92px;padding:10px 6px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:12px;color:var(--muted);text-align:center}
.opt.sel{border-color:var(--accent)}
.opt:disabled{opacity:.45}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.sw button{width:46px;height:26px;border-radius:13px;border:none;background:var(--muted);position:relative;flex:none}
.sw button::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw button.on{background:var(--accent)}
.sw button.on::after{left:23px}
.pop{max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.nm-rose{--c:#C2255C}.nm-blue{--c:#1C5FD4}.nm-violet{--c:#6741D9}.nm-gold{--c:#8A5A00}
.nm-rose,.nm-blue,.nm-violet,.nm-gold{color:color-mix(in srgb,var(--c),#fff var(--lt))}
.nm-grad{background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:nmshift 4s linear infinite}
.nm-aurora{background-image:linear-gradient(90deg,#34D399,#3B82F6,#8B5CF6,#34D399)}
.nm-sunset{background-image:linear-gradient(90deg,#F97316,#EC4899,#F59E0B,#F97316)}
.nm-neon{color:var(--neon);text-shadow:0 0 6px var(--neon-glow),0 0 14px var(--neon-glow)}
@keyframes nmshift{to{background-position:200% 0}}
@property --fc{syntax:'<color>';inherits:false;initial-value:#F43F5E}
.ava[class*=" fr-"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--fc,var(--accent))}
.fr-gold{--fc:#D69E2E}.fr-rose{--fc:#E0457B}.fr-blue{--fc:#3B82F6}.fr-violet{--fc:#8B5CF6}
.ava.fr-double{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--accent),0 0 0 5.5px var(--surface),0 0 0 7px var(--accent)}
.ava.fr-neon{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--neon),0 0 14px 4px var(--neon-glow)}
.fr-rainbow{animation:frhue 4s linear infinite}
@keyframes frhue{0%,100%{--fc:#F43F5E}25%{--fc:#F59E0B}50%{--fc:#10B981}75%{--fc:#3B82F6}}
@media (prefers-reduced-motion:reduce){.nm-grad,.fr-rainbow{animation:none}}
.bdg{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sq{width:40px;height:40px;padding:0;border-radius:50%}
#toast{position:fixed;left:0;right:0;bottom:84px;display:flex;justify-content:center;pointer-events:none;z-index:30;padding:0 16px}
#toast span{background:rgba(15,23,42,.88);color:#fff;padding:10px 16px;border-radius:14px;font-weight:600;max-width:420px}
#toast span.bad{background:rgba(180,35,24,.92)}

/* ===== NOVA DESKTOP REDESIGN ===== */
body{overflow:hidden;background:#eef1f6}
#app{width:100%;height:100dvh}
.nova-shell,.nova-chat-shell{width:100%;height:100dvh;display:grid;grid-template-columns:76px minmax(0,1fr);background:var(--bg)}
.nova-sidebar{height:100%;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 10px;z-index:20}
.nova-brand{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:22px;font-size:11px;color:var(--muted)}
.nova-brand span{width:42px;height:42px;border-radius:13px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
.nova-nav{display:flex;flex-direction:column;gap:7px;width:100%;flex:1}
.nova-nav button{width:100%;height:52px;border:0;background:transparent;color:var(--muted);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:700;transition:.18s}
.nova-nav button svg{width:22px;height:22px}
.nova-nav button:hover{background:var(--surface2);color:var(--ink)}
.nova-nav button.on{background:var(--accent-soft);color:var(--accent-ink)}
.nova-user{width:100%;display:flex;justify-content:center;cursor:pointer;padding:5px;border-radius:14px}
.nova-user .grow{display:none}
.nova-user:hover{background:var(--surface2)}
.nova-main{min-width:0;min-height:0;height:100%;display:flex;flex-direction:column;overflow:hidden}
.nova-top{height:64px;min-height:64px;flex:none;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.nova-top-title{font-size:20px;font-weight:800}
.nova-circle{width:38px;height:38px;border:1px solid var(--line);background:var(--surface2);border-radius:50%;display:flex;align-items:center;justify-content:center}
.nova-content{flex:1 1 auto;min-width:0;min-height:0;height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.nova-content>.wrap{width:100%;max-width:1100px;min-height:100%;box-sizing:border-box;margin:0 auto;padding:24px 28px 60px}
.nova-content>.wrap:after{content:"";display:block;height:1px}
.nova-content>.wrap>h1{display:none}
.nova-chat-shell{grid-template-columns:76px 310px minmax(0,1fr) 300px}
.nova-chat-list{background:var(--surface);border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column;overflow:hidden}
.nova-list-head{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 12px}
.nova-list-head>div{flex:1;display:flex;flex-direction:column}
.nova-list-head small{font-size:11px;color:var(--muted)}
.nova-back{border:0;background:transparent;font-size:24px;width:38px;height:38px;border-radius:12px}
.nova-back:hover{background:var(--surface2)}
.nova-current-user{padding:10px;border-bottom:1px solid var(--line)}
.nova-current-user .item{border:0;border-radius:12px;background:var(--accent-soft)}
.nova-mini-convs{overflow:auto;padding:4px 8px}
.nova-mini-convs .item{border:0;border-radius:12px;margin:2px 0}
.nova-mini-convs .item:hover{background:var(--surface2)}
.nova-chat-main{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.nova-chat-head{height:64px;flex:none;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px}
.nova-chat-head small{color:var(--muted);font-size:12px}
.nova-head-btn{width:38px;height:38px;border:0;background:var(--surface2);border-radius:12px;font-size:20px}
.nova-mobile-back{display:none;border:0;background:transparent;font-size:22px}
.nova-chat-main .msgs{padding:24px clamp(18px,4vw,70px);gap:10px}
.nova-chat-main .composer{padding:14px 24px 18px;background:var(--surface);border-top:1px solid var(--line)}
.nova-chat-main .composer .in{height:46px;border-radius:15px}
.nova-attach{width:44px;height:44px;border:0;border-radius:14px;background:var(--surface2);font-size:24px}
.nova-send{width:46px;height:46px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:19px}
.nova-info{background:var(--surface);border-left:1px solid var(--line);overflow:auto}
.nova-info-cover{height:130px;position:relative;overflow:hidden;background-size:cover;background-position:center}
.nova-info-cover img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.nova-info-body{padding:0 20px 28px;text-align:center;margin-top:-46px;position:relative}
.nova-info-body>.avw{display:inline-flex}
.nova-info-body>.avw .ava{border:4px solid var(--surface);box-sizing:content-box}
.nova-info-name{font-size:19px;font-weight:800;margin-top:12px}
.nova-online{font-size:12px;color:var(--accent-ink);margin-top:3px}
.nova-info-body>.btn{width:100%;margin-top:18px}
.nova-info-block{text-align:left;padding:16px 0;border-top:1px solid var(--line);margin-top:16px}
.nova-info-block p{margin:6px 0 0;white-space:pre-wrap;word-break:break-word}
.nova-empty{margin:auto;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);text-align:center}
.nova-empty div{font-size:42px;margin-bottom:5px}
.nova-empty b{color:var(--ink);font-size:17px}
.nova-empty span{font-size:13px}
@media(max-width:1050px){.nova-chat-shell{grid-template-columns:76px 290px minmax(0,1fr)}.nova-info{display:none}}
@media(max-width:760px){body{overflow:hidden}.nova-shell{display:block;height:100dvh;min-height:0}.nova-sidebar{position:fixed;left:0;right:0;bottom:0;width:100%;height:66px;display:flex;flex-direction:row;padding:5px 10px;border-right:0;border-top:1px solid var(--line)}.nova-brand,.nova-user{display:none}.nova-nav{flex-direction:row;gap:3px}.nova-nav button{height:56px;flex:1;flex-direction:column}.nova-main{height:calc(100dvh - 66px);min-height:0}.nova-top{height:58px;min-height:58px;padding:0 16px}.nova-content{height:0;min-height:0;overflow-y:auto;overflow-x:hidden}.nova-content>.wrap{min-height:max-content;padding:16px 12px 90px}.nova-chat-shell{display:flex;height:100dvh}.nova-chat-shell .nova-sidebar,.nova-chat-shell .nova-info{display:none}.nova-chat-list{display:none}.nova-chat-main{width:100%;height:100dvh}.nova-mobile-back{display:block}.nova-chat-main .msgs{padding:16px}.nova-chat-main .composer{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.nova-chat-main .composer .in{min-width:0}.nova-attach{display:none}}


/* ===== NOVA COLLECTIBLE GIFTS — Telegram / Slasher style ===== */
.nova-gift-page{display:flex;flex-direction:column;gap:16px;max-width:1100px;margin:0 auto}
.nova-gift-heading{display:flex;align-items:end;justify-content:space-between;gap:16px}
.nova-gift-heading h1{margin:0}
.nova-gift-heading .muted{font-size:13px}
.nova-gift-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.nova-gift-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:7px;cursor:pointer;overflow:hidden;transition:transform .18s,border-color .18s,box-shadow .18s;text-align:left}
.nova-gift-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 18px 44px rgba(0,0,0,.14)}
.nova-gift-card .nova-gift-thumb{height:210px;border-radius:13px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#6d7380,#a8adb7)}
.nova-gift-card .nova-gift-thumb:before,.nova-gift-art:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.18),transparent 28%),radial-gradient(circle at 80% 15%,rgba(255,255,255,.12),transparent 24%),linear-gradient(135deg,rgba(255,255,255,.09),transparent 42%,rgba(0,0,0,.08));pointer-events:none}
.nova-gift-card .nova-gift-thumb:after,.nova-gift-art:after{content:"";position:absolute;inset:0;opacity:.22;background-image:radial-gradient(circle,rgba(255,255,255,.65) 1px,transparent 1.5px);background-size:34px 34px;mask-image:linear-gradient(to bottom,black,transparent 85%);pointer-events:none}
.nova-gift-thumb .nova-gift-mini{width:70%;height:70%;position:relative;z-index:2;filter:drop-shadow(0 18px 18px rgba(0,0,0,.28));animation:novaGiftFloat 4.4s ease-in-out infinite}
.nova-gift-meta{padding:9px 6px 5px}.nova-gift-name{font-weight:850;font-size:14px}.nova-gift-number{font-size:11px;color:var(--muted);margin-top:2px}.nova-gift-state{font-size:10px;font-weight:800;opacity:.78;margin-top:4px}
.nova-gift-shine{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:3}.nova-gift-shine:before{content:"";position:absolute;left:-40%;top:-30%;width:60%;height:170%;transform:rotate(24deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);animation:novaGiftShine 4.8s linear infinite}
.nova-gift-owned-badge{position:absolute;left:9px;top:9px;z-index:5;padding:5px 8px;border-radius:999px;background:rgba(12,12,14,.65);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:10px;font-weight:900;backdrop-filter:blur(8px)}
.nova-gift-empty{padding:26px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}
.nova-gift-action{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.nova-gift-action .btn{flex:1;min-width:150px}
.nova-gift-action .btn.ghost{color:#fff;background:#17191b;border-color:#2a2d30}
.nova-gift-note{font-size:11px;color:#8d949d;margin-top:9px;text-align:center}
.nova-gift-profile{display:flex;flex-direction:column;gap:10px}
.nova-gift-profile-head{display:flex;align-items:end;justify-content:space-between;gap:12px}
.nova-gift-profile-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.nova-gift-profile-card{position:relative;border:1px solid var(--line);border-radius:15px;padding:6px;background:var(--surface);cursor:pointer;overflow:hidden;text-align:left}
.nova-gift-profile-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.nova-gift-profile-art{height:135px;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.nova-gift-profile-art svg{width:72%;height:72%;filter:drop-shadow(0 12px 14px rgba(0,0,0,.25));animation:novaGiftFloat 4.7s ease-in-out infinite}
.nova-gift-profile-card .mini-title{font-weight:850;font-size:12px;margin-top:7px}.nova-gift-profile-card .mini-sub{font-size:10px;color:var(--muted);margin-top:2px}
@keyframes novaGiftFloat{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
@keyframes novaGiftShine{0%{left:-50%}45%,100%{left:130%}}

/* fullscreen detail — compact Telegram / Slasher collectible composition */
.nova-gift-modal{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(0,0,0,.70);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.nova-gift-sheet{width:min(448px,100%);max-height:calc(100dvh - 24px);overflow:auto;border:1px solid rgba(255,255,255,.10);border-radius:18px;background:#090a0b;box-shadow:0 30px 90px rgba(0,0,0,.52);color:#f5f6f7;scrollbar-width:none}
.nova-gift-sheet::-webkit-scrollbar{display:none}

<body>
<div id="app"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const $app = document.getElementById('app');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const COLORS = ['#0F766E', '#1C5FD4', '#6741D9', '#C2255C', '#C2410C', '#8A5A00', '#2F855A'];
const colorOf = (n) => COLORS[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const EMAIL = (u) => u.toLowerCase() + '@nova.example.com';
const PCOLS = 'id,username,display_name,bio,music_url,music_title,avatar_url,banner_url,banner_x,banner_y,banner_zoom,banner_color,name_color,frame,hide_online,gr_public,last_seen,is_admin,is_premium,is_verified,title,is_banned,gr';
const NAMEFX = { default: ['Обычный', ''], rose: ['Розовый', 'nm-rose'], blue: ['Синий', 'nm-blue'], violet: ['Фиолетовый', 'nm-violet'], gold: ['Золотой', 'nm-gold'], aurora: ['Аврора · переливается', 'nm-grad nm-aurora'], sunset: ['Закат · переливается', 'nm-grad nm-sunset'], neon: ['Неон · свечение', 'nm-neon'] };
const FRAMES = { none: ['Без рамки', 0], gold: ['Золотая', 0], rose: ['Розовая', 0], blue: ['Синяя', 0], violet: ['Фиолетовая', 0], double: ['Двойная', 1], neon: ['Неон', 1], rainbow: ['Радужная', 1] };
const BANNERS = { sky: ['linear-gradient(135deg,#7DB4F5,#4B7BEC)', 0], mint: ['linear-gradient(135deg,#6EE7B7,#0F9488)', 0], lilac: ['linear-gradient(135deg,#C4B5FD,#7C5CE0)', 0], sunset: ['linear-gradient(135deg,#FDBA74,#EC4899)', 0], sand: ['linear-gradient(135deg,#E9D8A6,#C9A227)', 0], aurora: ['linear-gradient(135deg,#34D399,#7C5CE0)', 1] };
const prem = (p) => !!p.is_premium;
const nameOf = (p) => p.display_name || p.username;
const nameCls = (p) => (prem(p) && NAMEFX[p.name_color] ? NAMEFX[p.name_color][1] : '');
const frameCls = (p) => (p.frame && p.frame !== 'none' && FRAMES[p.frame] && (!FRAMES[p.frame][1] || prem(p)) ? 'fr-' + p.frame : '');
const bannerImg = (p, id = '') => p.banner_url ? `<img ${id ? `id="${id}"` : ''} src="${esc(p.banner_url)}" alt="" style="${bannerPos(p.banner_x, p.banner_y, p.banner_zoom)}">` : '';
const bannerPos = (x = 50, y = 50, z = 1) => `object-position:${x}% ${y}%;transform:scale(${z});transform-origin:${x}% ${y}%`;
const bannerCss = (p) => { const b = BANNERS[p.banner_color]; return (b && (!b[1] || prem(p)) ? b : BANNERS.sky)[0]; };
const online = new Set();
const isOnline = (p) => (me && p.id === me.id ? !p.hide_online : online.has(p.id));
const av = (p, s = 44) => `<span class="avw ${isOnline(p) ? 'on' : ''}" data-uid="${p.id}"><span class="ava ${frameCls(p)}" style="width:${s}px;height:${s}px;font-size:${Math.round(s * .4)}px;background:${colorOf(p.username)}">${p.avatar_url ? `<img src="${esc(p.avatar_url)}" alt="">` : esc(p.username[0].toUpperCase())}</span><i class="dot"></i></span>`;
const convAv = (c, s = 44) => `<span class="ava" style="width:${s}px;height:${s}px;border-radius:30%;font-size:${Math.round(s * .4)}px;background:${colorOf(c.title)}">${c.avatar_url ? `<img src="${esc(c.avatar_url)}" alt="">` : esc([...c.title][0].toUpperCase())}</span>`;
const SVG_OK = '<svg width="16" height="16" viewBox="0 0 24 24" role="img" aria-label="Подтверждённый профиль" style="flex:none;color:var(--accent)"><circle cx="12" cy="12" r="11" fill="currentColor"/><polyline points="7 12.5 10.5 16 17 9" style="fill:none;stroke:var(--on-accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"/></svg>';
const SVG_STAR = '<svg width="16" height="16" viewBox="0 0 24 24" role="img" aria-label="Premium" style="flex:none;color:var(--gold)"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="currentColor"/></svg>';
const nm = (p) => `<span class="name"><span class="${nameCls(p)}">${esc(nameOf(p))}</span>${p.is_verified ? SVG_OK : ''}${prem(p) ? SVG_STAR : ''}</span>`;
const hm = (d) => d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
const timeStr = (iso) => {
  const d = new Date(iso), now = new Date();
  if (d.toDateString() === now.toDateString()) return hm(d);
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + ', ' + hm(d);
};
function seenText(p) {
  if (me && p.id === me.id) return p.hide_online ? 'в сети · скрыто от других' : 'в сети';
  if (online.has(p.id)) return 'в сети';
  if (p.hide_online) return 'был(а) недавно';
  if (!p.last_seen) return 'был(а) давно';
  const d = new Date(p.last_seen), now = new Date();
  if (now - d < 180000) return 'в сети';
  if (d.toDateString() === now.toDateString()) return 'был(а) сегодня в ' + hm(d);
  if (new Date(now - 86400000).toDateString() === d.toDateString()) return 'был(а) вчера в ' + hm(d);
  return 'был(а) ' + d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
}
let toastT;
function toast(text, bad) {
  const t = document.getElementById('toast');
  t.innerHTML = `<span class="${bad ? 'bad' : ''}">${esc(text)}</span>`;
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.innerHTML = ''; }, 3000);
}

const PAL = {
  light: { '--bg': '#F3F5F9', '--surface': '#fff', '--surface2': '#EEF1F6', '--line': '#DDE2EC', '--ink': '#121A2D', '--muted': '#566077', '--danger': '#B42318', '--gold': '#B7791F', '--glass': 'rgba(255,255,255,.6)', '--glass-line': 'rgba(255,255,255,.75)', '--shadow': '0 8px 24px rgba(18,26,45,.14)', '--lt': '0%', a: '#0F766E' },
  dark: { '--bg': '#0D121F', '--surface': '#161C2E', '--surface2': '#1E2640', '--line': '#2B3552', '--ink': '#E9EDF6', '--muted': '#A0AABF', '--danger': '#FDA29B', '--gold': '#F5C451', '--glass': 'rgba(30,38,64,.6)', '--glass-line': 'rgba(255,255,255,.12)', '--shadow': '0 8px 24px rgba(0,0,0,.45)', '--lt': '50%', a: '#2DD4BF' }
};
const ACCS = ['#0F766E', '#2563EB', '#7C3AED', '#DB2777', '#EA580C', '#CA8A04', '#16A34A', '#475569'];
let theme = { m: 'auto', a: null };
try { Object.assign(theme, JSON.parse(localStorage.getItem('nova_theme'))); } catch (e) {}
const mq = matchMedia('(prefers-color-scheme:dark)');
const lum = (h) => { const n = parseInt(h.slice(1), 16); const [r, g, b] = [n >> 16, (n >> 8) & 255, n & 255].map((v) => { v /= 255; return v <= .04 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; };
function applyTheme() {
  const k = theme.m === 'dark' || (theme.m === 'auto' && mq.matches) ? 'dark' : 'light', s = document.documentElement.style, a = theme.a || PAL[k].a;
  Object.keys(PAL[k]).forEach((n) => { if (n[0] === '-') s.setProperty(n, PAL[k][n]); });
  s.setProperty('--accent', a); s.setProperty('--on-accent', lum(a) > .4 ? '#0B1220' : '#fff'); s.colorScheme = k;
}
function setTheme(p) { Object.assign(theme, p); try { localStorage.setItem('nova_theme', JSON.stringify(theme)); } catch (e) {} applyTheme(); }
mq.addEventListener('change', applyTheme); applyTheme();

const CFG = window.NOVA || {};
const configured = CFG.url && CFG.key && !String(CFG.url).startsWith('ВСТАВЬТЕ') && !String(CFG.key).startsWith('ВСТАВЬТЕ');
const sb = configured ? supabase.createClient(CFG.url, CFG.key) : null;
let me = null, tab = 'feed', chatWith = null, channel = null, presCh = null, back = 'feed', seenTimer = null;
const pcache = {};
const remember = (p) => { if (p && p.id) pcache[p.id] = Object.assign(pcache[p.id] || {}, p); return p; };

async function getProfile(id, fresh) {
  if (pcache[id] && !fresh) return pcache[id];
  const { data } = await sb.from('profiles').select(PCOLS).eq('id', id).single();
  return remember(data);
}

/* ---------- картинки: сжатие и загрузка ---------- */
function prepImage(file, o) {
  return new Promise((resolve, reject) => {
    if (!/^image\//.test(file.type)) return reject(new Error('Выберите изображение или GIF'));
    if (file.type === 'image/gif') return file.size <= 2 * 1024 * 1024 ? resolve(file) : reject(new Error('GIF больше 2 МБ: выберите файл поменьше'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Не удалось прочитать файл')); };
    img.onload = () => {
      let w = img.width, h = img.height, sx = 0, sy = 0, sw = w, sh = h;
      if (o.square) { const m = Math.min(w, h); sx = (w - m) / 2; sy = (h - m) / 2; sw = sh = m; w = h = m; }
      const k = Math.min(1, o.max / Math.max(w, h));
      const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob((b) => b ? resolve(b) : reject(new Error('Не удалось сжать фото')), 'image/jpeg', o.q || 0.85);
    };
    img.src = url;
  });
}
async function uploadImage(file, o) {
  const blob = await prepImage(file, o);
  const ext = blob.type === 'image/gif' ? 'gif' : 'jpg';
  const path = me.id + '/' + Date.now() + '.' + ext;
  const { error } = await sb.storage.from('media').upload(path, blob, { contentType: blob.type });
  if (error) throw new Error('Не удалось загрузить файл');
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}

/* ---------- «в сети» в реальном времени ---------- */
function refreshPresence() {
  document.querySelectorAll('.avw[data-uid]').forEach((el) => {
    const p = pcache[el.dataset.uid];
    el.classList.toggle('on', p ? isOnline(p) : online.has(el.dataset.uid));
  });
  document.querySelectorAll('[data-seen]').forEach((el) => { const p = pcache[el.dataset.seen]; if (p) el.textContent = seenText(p); });
}
function applyPresence() {
  if (!presCh) return;
  if (me.hide_online) presCh.untrack(); else presCh.track({ at: Date.now() });
}
function joinPresence() {
  if (presCh) sb.removeChannel(presCh);
  online.clear();
  presCh = sb.channel('online', { config: { presence: { key: me.id } } })
    .on('presence', { event: 'sync' }, () => { online.clear(); Object.keys(presCh.presenceState()).forEach((k) => online.add(k)); refreshPresence(); })
    .on('presence', { event: 'leave' }, ({ key }) => { if (pcache[key]) pcache[key].last_seen = new Date().toISOString(); online.delete(key); refreshPresence(); })
    .on('presence', { event: 'join' }, ({ key }) => { online.add(key); refreshPresence(); })
    .subscribe((st) => { if (st === 'SUBSCRIBED') setTimeout(applyPresence, 0); });
}

/* ---------- музыка в профиле ---------- */
const player = (u, extra = '') => `<div class="card col" style="gap:8px"><div class="row"><span style="font-size:22px">🎵</span><div class="grow"><div class="name">${esc(u.music_title || 'Музыка')}</div><div class="muted">Музыка в профиле</div></div>${extra}</div><audio controls preload="none" src="${esc(u.music_url)}" style="width:100%"></audio></div>`;
document.addEventListener('play', (e) => document.querySelectorAll('audio').forEach((a) => { if (a !== e.target) a.pause(); }), true);
const dropMusic = (url) => { const p = url && url.split('/music/')[1]; if (p) sb.storage.from('music').remove([decodeURIComponent(p)]); };

/* ---------- вход и регистрация ---------- */
function showSetup() {
  $app.innerHTML = `<div class="auth"><div class="card"><div class="logo"><i>N</i>Nova</div>
  <h1>Нужна настройка</h1><div class="muted">Создайте рядом с index.html файл config.js и вставьте в него адрес и ключ проекта Supabase (см. инструкцию).</div></div></div>`;
}
function showAuth(mode = 'login', err = '') {
  const reg = mode === 'register';
  $app.innerHTML = `<div class="auth"><div class="card">
    <div class="logo"><i>N</i>Nova</div>
    <div><h1>${reg ? 'Создать аккаунт' : 'Вход'}</h1><div class="muted">${reg ? 'Придумайте юзернейм и пароль. Почта не нужна.' : 'Войдите по юзернейму и паролю.'}</div></div>
    <label><div class="muted"><b>Юзернейм</b></div><input id="u" class="in" autocomplete="username" autocapitalize="none" placeholder="username"></label>
    <label><div class="muted"><b>Пароль</b></div><input id="p" class="in" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}" placeholder="Ваш пароль"></label>
    ${reg ? `<label><div class="muted"><b>Повторите пароль</b></div><input id="p2" class="in" type="password" autocomplete="new-password"></label>
    <div class="muted">Юзернейм от 3 символов: латиница, цифры и _. Пароль от 8 символов. Без почты пароль восстановить нельзя, запомните его.</div>` : ''}
    <div class="err" id="err" role="alert">${esc(err)}</div>
    <button class="btn" id="go">${reg ? 'Создать аккаунт' : 'Войти'}</button>
    <button class="btn ghost" id="sw">${reg ? 'У меня уже есть аккаунт' : 'Создать аккаунт'}</button></div></div>`;
  const go = document.getElementById('go');
  const fail = (m) => { document.getElementById('err').textContent = m; go.disabled = false; go.textContent = reg ? 'Создать аккаунт' : 'Войти'; };
  const submit = async () => {
    const u = document.getElementById('u').value.trim().replace(/^@/, '');
    const p = document.getElementById('p').value;
    if (!/^[A-Za-z][A-Za-z0-9_]{2,31}$/.test(u)) return fail('Юзернейм: от 3 символов, латиница, цифры и _, начинается с буквы');
    if (reg) {
      if (p.length < 8) return fail('Пароль: минимум 8 символов');
      if (p !== document.getElementById('p2').value) return fail('Пароли не совпадают');
    }
    go.disabled = true; go.textContent = 'Подождите…';
    if (reg) {
      const rnd = Array.from(crypto.getRandomValues(new Uint8Array(8))).map((x) => x.toString(16).padStart(2, '0')).join('');
      const { data, error } = await sb.auth.signUp({ email: 'u' + rnd + '@nova.example.com', password: p, options: { data: { username: u } } });
      if (error) return fail(/registered|already/i.test(error.message) ? 'Этот юзернейм уже занят' : /database/i.test(error.message) ? 'Юзернейм занят или недопустим' : 'Не удалось создать аккаунт: ' + error.message);
      if (!data.session) return fail('Вход не выполнен: в Supabase отключите «Confirm email» (см. инструкцию)');
    } else {
      const { data: em, error: e1 } = await sb.rpc('email_for', { p_username: u });
      const { error } = await sb.auth.signInWithPassword({ email: (!e1 && em) ? em : EMAIL(u), password: p });
      if (error) return fail('Неверный юзернейм или пароль');
    }
    start();
  };
  go.onclick = submit;
  $app.querySelectorAll('input').forEach((i) => i.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); }));
  document.getElementById('sw').onclick = () => showAuth(reg ? 'login' : 'register');
}

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showAuth();
  let prof = null;
  for (let i = 0; i < 4 && !prof; i++) {
    prof = (await sb.from('profiles').select(PCOLS).eq('id', session.user.id).maybeSingle()).data;
    if (!prof) await new Promise((r) => setTimeout(r, 400));
  }
  if (!prof) { await sb.auth.signOut(); return showAuth('login', 'Профиль не найден. Проверьте, что SQL-файлы выполнены'); }
  me = remember(prof);
  touchSeen(); clearInterval(seenTimer); seenTimer = setInterval(touchSeen, 60000);
  subscribe(); joinPresence(); loadConvs();
  go('feed');
  const j = /^#j=(\w+)/.exec(location.hash);
  if (j) { history.replaceState(null, '', location.pathname + location.search); joinConv(j[1]); }
}
function touchSeen() { if (me) sb.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', me.id).then(() => {}); }
function subscribe() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('nova')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'recipient=eq.' + me.id }, onIncoming)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, () => { if (tab === 'feed') loadFeed(); })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'conv_posts' }, onConvPost)
    .subscribe();
}
async function onIncoming(payload) {
  const m = payload.new;
  const p = await getProfile(m.sender);
  if (tab === 'chat' && chatWith && chatWith.id === m.sender) addBubble(m);

}

async function loadUserPosts(u) {
  const { data } = await sb.from('posts').select('id,body,image_url,created_at').eq('author', u.id).order('created_at', { ascending: false }).limit(20);

}

/* ---------- настройки ---------- */
async function saveMe(patch, okText) {
  const { error } = await sb.from('profiles').update(patch).eq('id', me.id);
  if (error) { toast('Не удалось сохранить', true); return false; }
  Object.assign(me, patch); remember(me);
  if (okText) toast(okText);
  if ('hide_online' in patch) { applyPresence(); refreshPresence(); }
  return true;
}

    <div class="muted">Цвет баннера, если нет фото</div>

  <div class="card col"><h2>Рамка аватара <span class="muted">· часть рамок — Premium</span></h2>

  const pick = (id, field, o, text, extra) => { document.getElementById(id).onchange = async (e) => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try { const url = await uploadImage(f, o); if (await saveMe(Object.assign({ [field]: url }, extra), text)) renderSettings(); } catch (er) { toast(er.message, true); }
  }; };
  document.getElementById('fm').onchange = async (e) => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    if (!/\.mp3$/i.test(f.name) || (f.type && f.type !== 'audio/mpeg')) return toast('Выберите файл формата MP3', true);
    if (f.size > 10 * 1024 * 1024) return toast('Файл больше 10 МБ', true);
    toast('Загружаю песню…');
    const path = me.id + '/' + Date.now() + '.mp3', old = me.music_url;
    const { error } = await sb.storage.from('music').upload(path, f, { contentType: 'audio/mpeg' });
    if (error) return toast('Не удалось загрузить песню', true);
    const url = sb.storage.from('music').getPublicUrl(path).data.publicUrl;
    if (await saveMe({ music_url: url, music_title: f.name.replace(/\.mp3$/i, '').trim().slice(0, 80) || 'Без названия' }, 'Песня добавлена в профиль')) { dropMusic(old); renderSettings(); }
  };
  const rm = document.getElementById('rm');
  if (rm) rm.onclick = async () => { const old = me.music_url; if (await saveMe({ music_url: null, music_title: null }, 'Песня удалена')) { dropMusic(old); renderSettings(); } };
  pick('fa', 'avatar_url', { square: true, max: 256, q: 0.85 }, 'Аватар обновлён');
  pick('fb', 'banner_url', { max: 1000, q: 0.8 }, 'Баннер обновлён', { banner_x: 50, banner_y: 50, banner_zoom: 1 });
  const bp = document.getElementById('bprev');
  if (bp) {
    const img = document.getElementById('bimg'), zs = document.getElementById('bz');
    let x = me.banner_x, y = me.banner_y, z = me.banner_zoom, drag = null;
    const apply = () => { img.setAttribute('style', bannerPos(x, y, z)); document.getElementById('bzv').textContent = z.toFixed(2); };
    const clamp = (n) => Math.max(0, Math.min(100, n));
    bp.onpointerdown = (e) => { drag = { px: e.clientX, py: e.clientY, x, y }; bp.setPointerCapture(e.pointerId); bp.style.cursor = 'grabbing'; };
    bp.onpointermove = (e) => { if (!drag) return; const r = bp.getBoundingClientRect(); x = clamp(drag.x - (e.clientX - drag.px) / r.width * 100 / z); y = clamp(drag.y - (e.clientY - drag.py) / r.height * 100 / z); apply(); };
    bp.onpointerup = bp.onpointercancel = () => { drag = null; bp.style.cursor = 'grab'; };
    zs.oninput = () => { z = parseFloat(zs.value); apply(); };
    document.getElementById('bsv').onclick = () => saveMe({ banner_x: +x.toFixed(1), banner_y: +y.toFixed(1), banner_zoom: +z.toFixed(2) }, 'Положение баннера сохранено');

  document.getElementById('unb').onclick = async () => {
    const v = document.getElementById('un').value.trim().replace(/^@/, '');

    const { error } = await sb.rpc('change_username', { p_new: v });

    await getProfile(me.id, true); toast('Юзернейм изменён: @' + me.username); renderSettings();
  };
  document.getElementById('out').onclick = async () => {
    if (channel) sb.removeChannel(channel);
    if (presCh) sb.removeChannel(presCh);
    clearInterval(seenTimer); await sb.auth.signOut(); me = null; showAuth();
  };
  if (me.is_admin) renderAdmin();
}

let adminSel = null, adminAll = false;
function renderAdmin() {
  const box = document.getElementById('admin'); if (!box) return;
  const t = adminSel ? pcache[adminSel] : null;
  box.innerHTML = `<h2>Администрирование</h2><div class="muted">Найдите пользователя по юзернейму или откройте список всех.</div>

  <div id="alist"></div>
  ${t ? `<div class="card col" style="background:var(--surface2)"><div class="row">${av(t, 48)}<div class="grow">${nm(t)}<div class="muted">@${esc(t.username)} · ${Number(t.gr).toLocaleString('ru-RU')} GR · <span data-seen="${t.id}">${esc(seenText(t))}</span></div></div><button class="btn ghost sm" id="aopen">Профиль</button></div>
    <div class="opts" style="gap:8px">
      <button class="btn sm ${t.is_premium ? 'on' : 'ghost'}" data-perk="premium">Premium</button>
      <button class="btn sm ${t.is_verified ? 'on' : 'ghost'}" data-perk="verified">Галочка</button>
      <button class="btn sm ${t.title === 'Модератор' ? 'on' : 'ghost'}" data-perk="mod">Модератор</button>
      ${t.id !== me.id ? `<button class="btn sm ${t.is_banned ? 'bad' : 'ghost'}" data-perk="ban">${t.is_banned ? 'Разблокировать' : 'Заблокировать'}</button>` : ''}</div>
    <div class="row wrapr"><input id="gra" class="in grow" placeholder="Сколько GR выдать" inputmode="numeric" style="min-width:140px"><button class="btn" id="grb">Выдать GR</button></div></div>` : '<div class="muted">Пользователь не выбран.</div>'}`;
  const list = document.getElementById('alist');
  const draw = (rows) => {
    rows.forEach(remember);
    list.innerHTML = rows.length ? `<div class="pop">${rows.map((p) => `<button class="item" data-pick="${p.id}">${av(p, 36)}<div class="grow">${nm(p)}<div class="muted">@${esc(p.username)} · ${Number(p.gr).toLocaleString('ru-RU')} GR</div></div></button>`).join('')}</div>` : '<div class="muted">Никого не найдено</div>';
    list.onclick = (e) => { const b = e.target.closest('[data-pick]'); if (b) { adminSel = b.dataset.pick; adminAll = false; renderAdmin(); } };
  };
  document.getElementById('aq').oninput = async (e) => {
    const q = e.target.value.trim().replace(/^@/, '').replace(/[%_,()\\]/g, '');
    if (!q) { list.innerHTML = ''; return; }
    const { data } = await sb.from('profiles').select(PCOLS).or(`username.ilike.%${q}%,display_name.ilike.%${q}%`).limit(10);
    draw(data || []);
  };
  document.getElementById('aall').onclick = () => { adminAll = !adminAll; renderAdmin(); };
  if (adminAll) sb.from('profiles').select(PCOLS).order('created_at').limit(200).then(({ data }) => draw(data || []));
  if (t) {
    document.getElementById('aopen').onclick = () => go('user', t);
    box.querySelectorAll('[data-perk]').forEach((b) => { b.onclick = async () => {
      const k = b.dataset.perk, a = { premium: t.is_premium, verified: t.is_verified, title: t.title || '', banned: t.is_banned };
      if (k === 'premium') a.premium = !a.premium; else if (k === 'verified') a.verified = !a.verified;
      else if (k === 'mod') a.title = a.title === 'Модератор' ? '' : 'Модератор'; else a.banned = !a.banned;
      const { error } = await sb.rpc('admin_set_user', { target: t.id, p_premium: a.premium, p_verified: a.verified, p_title: a.title, p_banned: a.banned });
      if (error) return toast('Не удалось изменить', true);
      await getProfile(t.id, true); if (t.id === me.id) me = pcache[me.id]; toast('Сохранено'); renderAdmin();
    }; });
    document.getElementById('grb').onclick = async () => {
      const n = parseInt(document.getElementById('gra').value, 10);
      if (!(n >= 1 && n <= 1000000)) return toast('Количество: от 1 до 1 000 000', true);
      const { error } = await sb.rpc('admin_grant_gr', { target: t.id, amount: n });
      if (error) return toast('Не удалось выдать GR', true);
      await getProfile(t.id, true); if (t.id === me.id) me = pcache[me.id]; toast('Выдано ' + n.toLocaleString('ru-RU') + ' GR: @' + t.username); renderAdmin();
    };
  }
}

/* ---------- активы пользователя в профиле ---------- */
async function loadUserAssets(u) {
  const [{ data: ns }, { data: nums }] = await Promise.all([
    sb.from('owned_names').select('name,listed,price').eq('owner', u.id).eq('archived', false),
    sb.from('phone_numbers').select('num').eq('owner', u.id)
  ]);
  const box = document.getElementById('pas'); if (!box) return;
  const sec = (title, rows) => rows.length ? `<div class="card list"><h2 style="padding:16px 16px 8px">${title}</h2>${rows.join('')}</div>` : '';
  const row = (a, b) => `<div class="item"><b>${a}</b><span class="muted">${b}</span></div>`;

    + sec('Анонимные номера', (nums || []).map((n) => row(esc(n.num), 'коллекционный номер')));
}

function formatRarity(v){
  const n=Number(v);
  if(!Number.isFinite(n)) return '';
  return (Math.round(n*10)/10).toLocaleString('en-US',{maximumFractionDigits:1})+'%';
}
function giftVisual(c){
  const fallback=NOVA_GIFT_TYPES_FALLBACK.find(x=>x.slug===c.slug) || NOVA_GIFT_TYPES_FALLBACK.find(x=>x.name.toLowerCase()===String(c.name||'').toLowerCase());
  return Object.assign({
    subtitle:'Коллекционный',
    tone1:'#858a93', tone2:'#4e535b', art:'gift'
  },fallback||{},c);
}
function giftState(g){
  if(g.upgraded_at) return `${g.model_name||'Улучшен'} · ${formatRarity(g.model_rarity)}`;
  if(g.owner_id) return 'Ваш · не улучшен';
  return `Свободен · ${Number(g.price_gr||100).toLocaleString('ru-RU')} GR`;
}
async function fetchNovaGiftData(force=false){
  if(novaGiftCatalogCache && novaGiftInstancesCache && !force) return {catalog:novaGiftCatalogCache,instances:novaGiftInstancesCache};
  const [cR,iR]=await Promise.all([
    sb.from('nova_gift_catalog').select('id,slug,name,price_gr,supply,created_at').order('created_at'),
    sb.from('nova_gift_instances').select('id,catalog_id,serial_number,owner_id,sender_id,purchased_at,upgraded,upgraded_at,model_name,model_rarity,pattern_name,pattern_rarity,background_name,background_rarity').order('serial_number')
  ]);
  if(cR.error || iR.error){
    novaGiftCatalogCache=null; novaGiftInstancesCache=null;
    const details=[cR.error&&('catalog: '+cR.error.message),iR.error&&('instances: '+iR.error.message)].filter(Boolean).join(' | ');
    throw new Error(details||'GIFT_SCHEMA_MISSING');
  }
  if(!Array.isArray(cR.data) || !Array.isArray(iR.data)) throw new Error('Supabase вернул некорректные данные');
  novaGiftCatalogCache=(cR.data||[]).map(giftVisual);
  novaGiftInstancesCache=iR.data||[];
  return {catalog:novaGiftCatalogCache,instances:novaGiftInstancesCache};
}
function giftTypeMap(catalog){const m={};(catalog||[]).forEach(x=>m[x.id]=x);return m;}
async function giftUserProfiles(ids){

  await Promise.all(uniq.map(id=>getProfile(id).catch(()=>null)));
}
function giftCard(c){

  const state=mine ? ('Ваш · #'+mine.serial_number) : (free ? 'Свободно · '+free : 'Все экземпляры разобраны');

  </button>`;

function giftOwnerAvatar(p){

function giftRow(label,value){return `<div class="nova-gift-row"><div class="nova-gift-label">${label}</div><div class="nova-gift-value">${value}</div></div>`;}
function attrValue(name,rarity){
  if(!name) return '<span style="color:#7e858e">Не улучшен</span>';

function giftForInstance(inst,c){return Object.assign({tone1:c.tone1,tone2:c.tone2,art:c.art,name:c.name,subtitle:'Коллекционный',supply:c.supply,price_gr:c.price_gr},inst,{serial:inst.serial_number,model:inst.model_name,pattern:inst.pattern_name,backdrop:inst.background_name,backdrop_rarity:inst.background_rarity,gift_type:inst.catalog_id});}
async function openGiftByKey(key){
  const {catalog,instances}=await fetchNovaGiftData();
  const map=giftTypeMap(catalog);
  if(key.startsWith('inst:')){
    const id=key.slice(5),inst=instances.find(x=>x.id===id);
    if(inst && map[inst.catalog_id]) return renderGiftModal(giftForInstance(inst,map[inst.catalog_id]));
  }
  if(key.startsWith('type:')){
    const id=key.slice(5),c=map[id]; if(!c)return;
    const mine=instances.find(x=>x.catalog_id===id && x.owner_id===me.id);
    if(mine)return renderGiftModal(giftForInstance(mine,c));
    return renderGiftModal(Object.assign({},c,{gift_type:id,unowned:true,freeCount:instances.filter(x=>x.catalog_id===id && !x.owner_id).length}));
  }
}

async function runGiftUpgradeAnimation(g,result){

  for(const kind of ['model','pattern','backdrop']){const cell=o.querySelector(`[data-roll="${kind}"]`),b=cell.querySelector('b');const stop=performance.now()+750;while(performance.now()<stop){b.textContent=pool[kind][Math.floor(Math.random()*pool[kind].length)];await new Promise(r=>setTimeout(r,70));}b.textContent=result[kind]?.name||'Готово';cell.classList.remove('rolling');cell.classList.add('done');await new Promise(r=>setTimeout(r,330));}
  await new Promise(r=>setTimeout(r,500));o.remove();
}

        ${n.listed ? `<button class="btn ghost sm" data-unlist="${esc(n.name)}">Снять с продажи</button>` : `<button class="btn ghost sm" data-main="${esc(n.name)}">Сделать основным</button><button class="btn sm" data-sell="${esc(n.name)}">Продать</button>`}
        ${sellFor === n.name ? `<div class="row" style="width:100%;margin-top:6px">${input('sp', 'Цена в GR', 'inputmode="numeric"')}<button class="btn sm" data-sellgo="${esc(n.name)}">Выставить</button><button class="btn ghost sm" data-sellx="1">Отмена</button></div>` : ''}</div>`).join(''))
    + `<div class="card col"><h2>Продать любой юзернейм</h2><div class="muted">Придумайте свободный юзернейм от 3 символов и выставьте его на продажу. Деньги получите вы.</div>
      <div class="row wrapr">${input('nn', 'например, fox')}${input('np', 'Цена в GR', 'inputmode="numeric"')}<button class="btn" data-sellnew="1">Выставить</button></div></div>`
    + card('Юзернеймы на продажу', lotsN.map((n) => rowL('@' + esc(n.name), seller(n) + ' · ' + n.name.length + ' симв.', gr(n.price),
        n.owner === me.id ? '<span class="tag">Ваш лот</span>' : buyBtn(`data-buy="${n.id}"`, n.price) + arch('name', n.id))).join(''), 'Юзернеймы от 3 символов.');
  } else if (mTab === 'numbers') {
    body = card('Мои номера', P.filter((n) => n.owner === me.id).map((n) => rowL(esc(n.num), 'Показывается в вашем профиле', '', '<span class="tag">Ваш номер</span>')).join(''), 'Анонимный номер — коллекционный. Для входа в аккаунт номера не используются.')
      + card('Номера на продажу', lotsP.map((n) => rowL(esc(n.num), 'Анонимный номер', gr(n.price), buyBtn(`data-buynum="${n.id}"`, n.price) + arch('number', n.id))).join(''));
  } else if (me.is_admin) {
    const archived = [...N.filter((n) => n.archived).map((n) => ['name', n.id, '@' + esc(n.name), n.price]), ...P.filter((n) => n.archived).map((n) => ['number', n.id, esc(n.num), n.price])];
    body = `<div class="card col"><h2>Новый юзернейм в Маркет</h2><div class="row wrapr">${input('an', 'юзернейм')}${input('ap', 'Цена в GR', 'inputmode="numeric"')}<button class="btn" data-addname="1">Добавить</button></div></div>
      <div class="card col"><h2>Новый анонимный номер</h2><div class="row wrapr">${input('anum', '8 цифр', 'inputmode="numeric"')}${input('anp', 'Цена в GR', 'inputmode="numeric"')}<button class="btn" data-addnum="1">Добавить</button></div></div>`
      + card('Архив', archived.map((a) => rowL(a[2], a[0] === 'name' ? 'Юзернейм' : 'Номер', a[3] ? gr(a[3]) : '', `<button class="btn ghost sm" data-unarch="${a[0]}:${a[1]}">Вернуть в Маркет</button>`)).join(''));
  }
  v.innerHTML = `<h1>Маркет</h1><div class="card row"><div class="grow muted">Ваш баланс</div><b style="font-size:18px">${gr(me.gr)}</b></div>
    <div class="row wrapr" style="gap:8px">${[['names', 'Юзернеймы'], ['numbers', 'Анонимные номера']].concat(me.is_admin ? [['admin', 'Админ']] : []).map((t) => `<button class="btn sm ${mTab === t[0] ? 'on' : 'ghost'}" data-mt="${t[0]}">${t[1]}</button>`).join('')}</div>${body}`;
  const val = (id) => (document.getElementById(id) || {}).value || '';
  const price = (s) => { const n = money(s); return n >= 1 && n <= 10000000 ? n : 0; };
  const num8 = (s) => { const d = s.replace(/\D/g, ''); return d.length === 8 ? '+000 ' + d.slice(0, 4) + ' ' + d.slice(4) : ''; };
  v.onclick = async (e) => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const d = b.dataset; let ok = null;
    if (d.mt) { mTab = d.mt; sellFor = ''; return renderMarket(); }
    if (d.sell) { sellFor = d.sell; return renderMarket(); }
    if (d.sellx) { sellFor = ''; return renderMarket(); }
    if (d.sellgo) { const p = price(val('sp')); if (!p) return toast('Цена: целое число от 1 до 10 000 000', true); ok = await mdo('market_list', { p_name: d.sellgo, p_price: p }, '@' + d.sellgo + ' выставлен на продажу за ' + gr(p)); sellFor = ''; }
    else if (d.unlist) ok = await mdo('market_unlist', { p_name: d.unlist }, '@' + d.unlist + ' снят с продажи');
    else if (d.main) ok = await mdo('market_make_main', { p_name: d.main }, 'Основной юзернейм: @' + d.main);
    else if (d.sellnew) { const p = price(val('np')); if (!p) return toast('Цена: целое число от 1 до 10 000 000', true); ok = await mdo('market_list_new', { p_name: val('nn').trim().replace(/^@/, ''), p_price: p }, 'Юзернейм выставлен на продажу за ' + gr(p)); }
    else if (d.buy) ok = await mdo('market_buy_name', { p_id: d.buy }, 'Юзернейм куплен. Он добавлен в ваш профиль');
    else if (d.buynum) ok = await mdo('market_buy_number', { p_id: d.buynum }, 'Номер куплен. Он добавлен в ваш профиль');
    else if (d.addname) { const p = price(val('ap')); if (!p) return toast('Цена: целое число от 1 до 10 000 000', true); ok = await mdo('admin_add_name', { p_name: val('an').trim().replace(/^@/, ''), p_price: p }, 'Юзернейм добавлен в Маркет'); }
    else if (d.addnum) { const n = num8(val('anum')), p = price(val('anp')); if (!n) return toast('Номер: ровно 8 цифр', true); if (!p) return toast('Цена: целое число от 1 до 10 000 000', true); ok = await mdo('admin_add_number', { p_num: n, p_price: p }, 'Номер ' + n + ' добавлен в Маркет'); }
    else if (d.arch || d.unarch) { const [k, id] = (d.arch || d.unarch).split(':'); ok = await mdo('admin_set_archived', { p_kind: k, p_id: id, p_archived: !!d.arch }, d.arch ? 'Убрано в архив' : 'Возвращено в Маркет'); }
    if (ok !== null) renderMarket();
  };
}

/* ---------- группы и каналы ---------- */
let convs = {}, curConv = null;
const CCOLS = 'id,kind,title,about,username,owner,avatar_url,comments_on,members_write,system,created_at';
const isAdm = (c) => c.role === 'owner' || c.role === 'admin';
const canWrite = (c) => !me.is_banned && (isAdm(c) || (c.kind === 'group' && c.members_write));
async function loadConvs() {
  const { data } = await sb.from('conv_members').select(`role,last_read,convs(${CCOLS})`).eq('user_id', me.id);
  convs = {};
  (data || []).forEach((r) => { if (r.convs) convs[r.convs.id] = Object.assign(r.convs, { role: r.role, last_read: r.last_read }); });
}
async function joinConv(ref) {
  const { data, error } = await sb.rpc('conv_join', { p_ref: ref });
  if (error) return toast(error.message || 'Не удалось вступить', true);
  await loadConvs(); if (convs[data]) go('conv', convs[data]);
}
function convForm(kind) {
  const box = document.getElementById('cform');
  box.innerHTML = `<div class="card col" style="background:var(--surface2)"><h2>${kind === 'channel' ? 'Новый канал' : 'Новая группа'}</h2>
    <input id="ct" class="in" maxlength="60" placeholder="Название"><textarea id="ca" class="in" maxlength="300" placeholder="Описание (необязательно)"></textarea>
    <input id="cu" class="in" maxlength="32" autocapitalize="none" placeholder="Публичный юзернейм (необязательно)">
    <div class="muted">Без юзернейма доступ только по приватной ссылке.</div>
    <div class="row wrapr"><button class="btn" id="cok">Создать</button><button class="btn ghost" id="cx">Отмена</button></div></div>`;
  document.getElementById('cx').onclick = () => { box.innerHTML = ''; };
  document.getElementById('cok').onclick = async () => {
    const { data, error } = await sb.rpc('conv_create', { p_kind: kind, p_title: document.getElementById('ct').value, p_about: document.getElementById('ca').value, p_username: document.getElementById('cu').value.replace(/^@/, '') });
    if (error) return toast(error.message || 'Не удалось создать', true);
    await loadConvs(); if (convs[data]) go('conv', convs[data]);
  };
}
async function markRead(c) {
  c.last_read = new Date().toISOString();
  await sb.from('conv_members').update({ last_read: c.last_read }).eq('conv', c.id).eq('user_id', me.id);
}
async function onConvPost({ new: m }) {
  const c = convs[m.conv]; if (!c) return;
  if (tab === 'conv' && curConv && curConv.id === m.conv) { await getProfile(m.author); addItem(m); markRead(c); }
  else if (m.author !== me.id) { toast('Новое в «' + c.title + '»'); if (tab === 'chats') loadChats(); }
}
const cmsg = (m, c) => {
  const a = pcache[m.author] || m.profiles || { username: '?' }, mine = m.author === me.id, del = mine || isAdm(c);
  const x = `${m.body.trim() ? `<div class="post-body" style="margin:4px 0">${esc(m.body)}</div>` : ''}${m.image_url ? `<img class="pimg" src="${esc(m.image_url)}" alt="" loading="lazy">` : ''}`;
  const d = del ? `<button class="link" style="color:${c.kind === 'group' ? 'inherit;opacity:.7;font-size:11px;padding:0' : 'var(--danger)'}" data-del="${m.id}">Удалить</button>` : '';
  if (c.kind === 'group') return `<div class="b ${mine ? 'me' : 'it'}" data-id="${m.id}">${mine ? '' : `<b class="ell" style="display:block;font-size:13px">${esc(nameOf(a))}</b>`}${x}<small>${timeStr(m.created_at)} ${d}</small></div>`;
  const n = m.conv_comments && m.conv_comments[0] ? m.conv_comments[0].count : 0;
  return `<article class="card" data-id="${m.id}"><div class="muted">${timeStr(m.created_at)}</div>${x}<div class="row wrapr">${c.comments_on ? `<button class="link" data-cm="${m.id}">Комментарии (${n})</button>` : ''}${d}</div><div class="cms"></div></article>`;
};
function addItem(m) {
  const box = document.getElementById('msgs'); if (!box || box.querySelector(`[data-id="${m.id}"]`)) return;
  const e = box.querySelector('.muted.e'); if (e) e.remove();
  box.insertAdjacentHTML('beforeend', cmsg(m, curConv)); box.scrollTop = box.scrollHeight;
}
async function renderConv(c) {
  curConv = c; chatWith = null;
  const ch = c.kind === 'channel';
  $app.innerHTML = `<div class="chat"><div class="chat-head"><button class="btn ghost sm" id="back" aria-label="Назад">←</button><button class="row grow link" id="ci" style="padding:0;text-align:left;min-width:0;color:var(--ink)">${convAv(c)}<span class="grow ell"><span class="name">${esc(c.title)}${c.system ? SVG_OK : ''}</span><span class="muted ell" id="cmem" style="display:block">${ch ? 'Канал' : 'Группа'}</span></span></button></div>
  <div class="msgs" id="msgs"></div>
  ${canWrite(c) ? `<form class="composer" id="f"><label class="btn ghost file" style="padding:0 14px" aria-label="Фото">📎<input type="file" id="cf" accept="image/*"></label><input class="in" id="mt" maxlength="4000" placeholder="${ch ? 'Новая публикация' : 'Сообщение'}" autocomplete="off"><button class="btn">Отправить</button></form>` : `<div class="composer muted" style="justify-content:center">${ch ? 'Публикуют только администраторы' : 'Писать могут только администраторы'}</div>`}</div>`;
  document.getElementById('back').onclick = () => go('chats');
  document.getElementById('ci').onclick = () => go('convinfo', c);
  sb.from('conv_members').select('user_id', { count: 'exact', head: true }).eq('conv', c.id).then(({ count }) => { const e = document.getElementById('cmem'); if (e && count != null) e.textContent = (ch ? 'Канал' : 'Группа') + ' · ' + count + ' уч.'; });
  const { data } = await sb.from('conv_posts').select(`id,conv,body,image_url,created_at,author,profiles!author(${PCOLS}),conv_comments(count)`).eq('conv', c.id).order('created_at', { ascending: false }).limit(100);
  const box = document.getElementById('msgs'); if (!box || curConv !== c) return;
  (data || []).forEach((m) => remember(m.profiles));
  box.innerHTML = (data || []).reverse().map((m) => cmsg(m, c)).join('') || '<div class="muted e" style="text-align:center">Пока пусто</div>';
  box.scrollTop = box.scrollHeight; markRead(c);
  box.onclick = async (e) => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.cm) toggleComments(t.closest('article'), t.dataset.cm, 'conv_comments', 'post', isAdm(c));
    else if (t.dataset.del && confirm('Удалить?')) { const r = await sb.from('conv_posts').delete().eq('id', t.dataset.del); if (r.error) toast('Не удалось удалить', true); else t.closest('[data-id]').remove(); }
  };
  const f = document.getElementById('f'); if (!f) return;
  const send = async (image_url) => {
    const i = document.getElementById('mt'), body = i.value.trim(); if (!body && !image_url) return;
    i.value = '';
    const { data: m, error } = await sb.from('conv_posts').insert({ conv: c.id, body, image_url }).select().single();
    if (error) { i.value = body; return toast(me.is_banned ? 'Вы заблокированы' : 'Не удалось отправить', true); }
    addItem(m);
  };
  f.onsubmit = (e) => { e.preventDefault(); send(null); };
  document.getElementById('cf').onchange = async (e) => {
    const fl = e.target.files[0]; e.target.value = ''; if (!fl) return;
    try { toast('Загружаю…'); send(await uploadImage(fl, { max: 1280, q: 0.82 })); } catch (er) { toast(er.message, true); }
  };
}

async function renderConvInfo(c) {
  const ch = c.kind === 'channel', adm = isAdm(c), own = c.role === 'owner', sys = c.system;
  const { data: mem } = await sb.from('conv_members').select(`user_id,role,profiles!user_id(${PCOLS})`).eq('conv', c.id).limit(300);
  const v = view(); if (!v) return;
  (mem || []).forEach((r) => remember(r.profiles));
  const sw = (k, t, d, on) => `<div class="sw"><div><div><b>${t}</b></div><div class="muted">${d}</div></div><button data-cs="${k}" class="${on ? 'on' : ''}" aria-label="${t}"></button></div>`;
  const RL = { owner: 'Владелец', admin: 'Админ' };
  v.innerHTML = `<div class="row"><button class="btn ghost sm" id="bk" aria-label="Назад">←</button><h1>${ch ? 'Канал' : 'Группа'}</h1></div>
  <div class="card col"><div class="row">${convAv(c, 56)}<div class="grow"><div class="name" style="font-size:18px">${esc(c.title)}${sys ? SVG_OK : ''}</div><div class="muted">${c.username ? '@' + esc(c.username) + ' · ' : ''}${(mem || []).length} уч.</div></div></div>${c.about ? `<div class="post-body" style="margin:0">${esc(c.about)}</div>` : ''}</div>
  ${adm ? `<div class="card col"><h2>Настройки</h2>
    <input id="st" class="in" maxlength="60" value="${esc(c.title)}" placeholder="Название"><textarea id="sa" class="in" maxlength="300" placeholder="Описание">${esc(c.about || '')}</textarea>
    <div class="row wrapr"><label class="btn ghost sm file">Сменить аватар<input type="file" id="sf" accept="image/*"></label>${c.avatar_url ? '<button class="btn ghost sm" id="sr">Убрать аватар</button>' : ''}</div>
    ${ch ? sw('comments_on', 'Комментарии к постам', 'Если выключить, под постами нельзя комментировать', c.comments_on) : sw('members_write', 'Участники могут писать', 'Если выключить, писать смогут только админы', c.members_write)}
    <div><button class="btn" id="ss">Сохранить</button></div></div>` : ''}
  ${own && !sys ? `<div class="card col"><h2>Юзернейм</h2><div class="muted">С юзернеймом ${ch ? 'канал' : 'группу'} можно найти через поиск. Оставьте пустым, чтобы скрыть.</div><div class="row wrapr"><input id="su" class="in grow" maxlength="32" autocapitalize="none" value="${esc(c.username || '')}" placeholder="username" style="min-width:160px"><button class="btn" id="sub">Сохранить</button></div></div>` : ''}
  ${adm ? `<div class="card col"><h2>Ссылка-приглашение</h2><div class="row wrapr"><input id="il" class="in grow" readonly placeholder="Нажмите «Показать»" style="min-width:160px"><button class="btn ghost sm" id="ish">Показать</button><button class="btn ghost sm" id="icp">Копировать</button></div>${sys ? '' : '<button class="btn ghost sm" id="irs" style="align-self:flex-start">Сбросить ссылку</button>'}</div>` : ''}
  <div class="card list"><h2 style="padding:16px 16px 8px">Участники</h2>${(mem || []).map((r) => { const p = pcache[r.user_id]; if (!p) return ''; const can = !sys && r.role !== 'owner' && r.user_id !== me.id && (own || (c.role === 'admin' && r.role === 'member'));
    return `<div class="item" style="flex-wrap:wrap" data-m="${r.user_id}"><button class="link row grow" style="padding:0;text-align:left;min-width:0" data-op="${r.user_id}">${av(p, 36)}<span class="grow ell">${nm(p)}<span class="muted" style="display:block">@${esc(p.username)}</span></span></button>${RL[r.role] ? `<span class="tag">${RL[r.role]}</span>` : ''}
    ${own && !sys && r.role !== 'owner' ? `<button class="btn ghost sm" data-rl="${r.user_id}:${r.role === 'admin' ? 'member' : 'admin'}">${r.role === 'admin' ? 'Снять админа' : 'Сделать админом'}</button>` : ''}${can ? `<button class="btn ghost sm" style="color:var(--danger)" data-kick="${r.user_id}">Исключить</button>` : ''}</div>`; }).join('')}</div>
  ${sys ? '' : `<div class="card col">${own ? `<button class="btn bad" id="cdel">Удалить ${ch ? 'канал' : 'группу'}</button>` : '<button class="btn ghost" id="clv">Покинуть</button>'}</div>`}`;
  const $ = (id) => document.getElementById(id);
  const run = async (fn, args, ok, after) => { const { data, error } = await sb.rpc(fn, args); if (error) { toast(error.message || 'Не удалось', true); return null; } if (ok) toast(ok); if (after) await after(data); return data === undefined ? true : data; };
  const reload = async () => { await loadConvs(); if (convs[c.id]) go('convinfo', convs[c.id]); else go('chats'); };
  $('bk').onclick = () => go('conv', c);
  const flags = { comments_on: c.comments_on, members_write: c.members_write }, ava = { v: c.avatar_url };
  v.querySelectorAll('[data-cs]').forEach((b) => { b.onclick = () => { flags[b.dataset.cs] = !flags[b.dataset.cs]; b.classList.toggle('on', flags[b.dataset.cs]); }; });
  if ($('ss')) {
    $('ss').onclick = () => run('conv_update', { p_id: c.id, p_title: $('st').value, p_about: $('sa').value, p_comments: flags.comments_on, p_write: flags.members_write, p_avatar: ava.v }, 'Сохранено', reload);
    $('sf').onchange = async (e) => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { ava.v = await uploadImage(f, { square: true, max: 256, q: 0.85 }); $('ss').click(); } catch (er) { toast(er.message, true); } };
    if ($('sr')) $('sr').onclick = () => { ava.v = null; $('ss').click(); };
  }
  if ($('sub')) $('sub').onclick = () => run('conv_set_username', { p_id: c.id, p_name: $('su').value.replace(/^@/, '') }, 'Юзернейм сохранён', reload);
  if ($('ish')) {
    const link = (code) => { $('il').value = location.origin + location.pathname + '#j=' + code; };
    $('ish').onclick = () => run('conv_invite', { p_id: c.id }, null, link);
    $('icp').onclick = async () => { if (!$('il').value) await $('ish').onclick(); try { await navigator.clipboard.writeText($('il').value); toast('Ссылка скопирована'); } catch (e) { $('il').select(); } };
    if ($('irs')) $('irs').onclick = () => { if (confirm('Старая ссылка перестанет работать. Сбросить?')) run('conv_reset_invite', { p_id: c.id }, 'Ссылка сброшена', link); };
  }
  v.onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
    if (d.op) openUser(d.op);
    else if (d.rl) { const [u, r] = d.rl.split(':'); run('conv_set_role', { p_id: c.id, p_user: u, p_role: r }, 'Сохранено', reload); }
    else if (d.kick && confirm('Исключить участника?')) run('conv_kick', { p_id: c.id, p_user: d.kick }, 'Участник исключён', reload);
  };
  if ($('clv')) $('clv').onclick = () => { if (confirm('Покинуть?')) run('conv_leave', { p_id: c.id }, 'Вы вышли', async () => { await loadConvs(); go('chats'); }); };
  if ($('cdel')) $('cdel').onclick = () => { if (confirm('Удалить безвозвратно вместе со всеми сообщениями?')) run('conv_delete', { p_id: c.id }, 'Удалено', async () => { await loadConvs(); go('chats'); }); };
}

if (!configured) showSetup(); else start();
window.addEventListener('pagehide', () => { if (me) touchSeen(); });
document.addEventListener('visibilitychange', () => { if (me && document.visibilityState === 'hidden') touchSeen(); });
</script>
